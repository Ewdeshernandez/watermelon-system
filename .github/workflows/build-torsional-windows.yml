name: build-torsional-windows

# Compila el módulo NATIVO de análisis torsional (native/watermelon_torsional.py)
# a un .exe de Windows (onedir) con PyInstaller + instalador Inno Setup. Homólogo
# a build-modal-windows.yml pero para Watermelon Torsional (Binsfeld TorqueTrak
# 10K -> NI 9229).
#
# Disparar:
#   · Manual  -> Actions -> "build-torsional-windows" -> Run workflow
#   · Tag     -> git tag torsional-vX.Y.Z && git push origin torsional-vX.Y.Z

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'torsional-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy "PySide6>=6.6" "pyqtgraph>=0.13" nidaqmx nitypes hightime npTDMS supabase pillow certifi cryptography pyinstaller

      - name: Embeber credenciales de nube (desde GitHub Secrets)
        # ANON key (pública por diseño) para futuros uploads con RLS; NO el service key.
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY vacío — el .exe quedará sin credenciales de nube (uploads offline)."
          fi
          printf 'SUPABASE_URL = "%s"\nSUPABASE_KEY = "%s"\n' "$SB_URL" "$SB_KEY" \
            > core/remote_monitoring/_cloud_config.py
          echo "cloud: url=$([ -n "$SB_URL" ] && echo SET || echo empty)  key=$([ -n "$SB_KEY" ] && echo SET || echo empty)"

      - name: Compilar WatermelonTorsional.exe (onedir)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name WatermelonTorsional \
            --windowed \
            --contents-directory _internal \
            --paths . \
            --collect-submodules core.torsional \
            --collect-submodules core.remote_monitoring \
            --hidden-import core.torsional.scaling \
            --hidden-import core.torsional.sim_source \
            --hidden-import core.torsional.analysis \
            --hidden-import core.torsional.shunt_cal \
            --hidden-import core.modal.acq_backend \
            --hidden-import core.remote_monitoring.stream_source \
            --hidden-import core.remote_monitoring._cloud_config \
            --collect-all cryptography \
            --hidden-import cryptography \
            --hidden-import certifi \
            --copy-metadata certifi \
            --collect-data certifi \
            --hidden-import PIL \
            --add-data "assets/watermelon_logo.png;assets" \
            --icon "assets/watermelon.ico" \
            --collect-submodules scipy \
            --collect-all supabase \
            --copy-metadata supabase \
            --collect-all nidaqmx \
            --collect-submodules nidaqmx \
            --copy-metadata nidaqmx \
            --hidden-import nidaqmx \
            --collect-all nitypes \
            --copy-metadata nitypes \
            --hidden-import nitypes \
            --copy-metadata hightime \
            --hidden-import hightime \
            --hidden-import deprecation \
            --exclude-module streamlit \
            --exclude-module matplotlib \
            --exclude-module pandas \
            native/watermelon_torsional.py

      - name: Empaquetar binario + lanzador
        shell: bash
        run: |
          mkdir -p out_torsional
          cp -r dist/WatermelonTorsional/. out_torsional/
          printf '@echo off\r\n"%%~dp0WatermelonTorsional.exe" --sim\r\npause\r\n' \
            > out_torsional/0_SIMULADOR_torsional.bat
          cat > out_torsional/LEEME.txt <<'TXT'
          Watermelon Torsional - analisis de par / vibracion torsional (Windows)
          =====================================================================

          Telemetria de par Binsfeld TorqueTrak 10K (galga en el eje -> receptor
          RX10K -> salida analogica +/-10 V) leida con tarjeta NI 9229 (voltaje DC,
          muestreo simultaneo). Sin hardware: doble clic en
          0_SIMULADOR_torsional.bat -> demo simulada.

          PESTANAS:
            1) Configuration: geometria del eje + galga -> calibracion V->torque.
            2) Live torque: par en vivo, espectro y ordenes.
            3) Shunt check: verificacion de calibracion con Ref 1 / Ref 2.
            4) Run-up: order tracking (Campbell de torque).

          Marco: API 684 (Campbell + margenes) / ISO 22266 (torsional).
          TXT
          ls -la out_torsional

      - uses: actions/upload-artifact@v4
        with:
          name: WatermelonTorsional-windows
          path: out_torsional/
          retention-days: 30

      - name: Instalar Inno Setup
        if: startsWith(github.ref, 'refs/tags/torsional-v')
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        if: startsWith(github.ref, 'refs/tags/torsional-v')
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^torsional-v',''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files (x86)","C:\Program Files" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          "ISCC=$iscc  VER=$ver" | Tee-Object installer_log.txt
          if (-not $iscc) { "ISCC.exe NOT FOUND" | Tee-Object -Append installer_log.txt; exit 0 }
          & $iscc "/DMyAppVersion=$ver" "native/installer/watermelon_torsional.iss" 2>&1 | Tee-Object -Append installer_log.txt
          if (Test-Path WatermelonTorsional-Setup.exe) { "OK: setup built" | Tee-Object -Append installer_log.txt }
          else { "no setup exe" | Tee-Object -Append installer_log.txt }

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/torsional-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ASSETS=""
          [ -f WatermelonTorsional-Setup.exe ] && ASSETS="WatermelonTorsional-Setup.exe"
          [ -f installer_log.txt ] && ASSETS="$ASSETS installer_log.txt"
          gh release create "${GITHUB_REF_NAME}" $ASSETS \
            --title "Watermelon Torsional ${GITHUB_REF_NAME}" \
            --notes "Watermelon Torsional — native analysis module (Windows). Installer: WatermelonTorsional-Setup.exe. Not code-signed yet -> SmartScreen may ask for confirmation." \
          || for a in $ASSETS; do gh release upload "${GITHUB_REF_NAME}" "$a" --clobber; done
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest || true
