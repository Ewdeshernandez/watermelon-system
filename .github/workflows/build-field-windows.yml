name: build-field-windows

# Compila el módulo NATIVO (native/watermelon_field.py) a UN SOLO .exe de Windows
# con PyInstaller. El binario es lo único que se lleva a la PC de campo: el
# código fuente NUNCA se copia a esa máquina (secreto industrial).
#
# Disparar:
#   · Manual  -> pestaña Actions -> "build-field-windows" -> Run workflow
#   · Tag     -> git tag field-vX.Y.Z && git push origin field-vX.Y.Z
#
# Resultado: artefacto "WatermelonField-windows" (Actions -> corrida -> Artifacts)
# con WatermelonField.exe + lanzadores .bat + instrucciones.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'field-v*'

permissions:
  contents: write   # para publicar el Release con el .exe (descarga directa, sin login)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del nativo + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy "PySide6>=6.6" "pyqtgraph>=0.13" nidaqmx supabase pyinstaller

      - name: Embeber credenciales de nube (anon key) desde GitHub Secrets
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          printf 'SUPABASE_URL = "%s"\nSUPABASE_KEY = "%s"\n' "$SB_URL" "$SB_KEY" \
            > core/remote_monitoring/_cloud_config.py
          echo "cloud: url=$([ -n "$SB_URL" ] && echo SET || echo empty) key=$([ -n "$SB_KEY" ] && echo SET || echo empty)"

      - name: Compilar WatermelonField.exe (onefile)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name WatermelonField \
            --paths . \
            --collect-submodules core.remote_monitoring \
            --collect-submodules core.modal \
            --hidden-import core.loaders.base \
            --hidden-import core.signal_registry \
            --hidden-import core.sensor_map \
            --hidden-import core.supabase_auth \
            --hidden-import core.remote_monitoring._cloud_config \
            --collect-all nidaqmx \
            --collect-all supabase \
            --copy-metadata supabase \
            --exclude-module streamlit \
            --exclude-module matplotlib \
            --exclude-module pandas \
            native/watermelon_field.py

      - name: Empaquetar binario + lanzadores
        shell: bash
        run: |
          mkdir -p out
          cp dist/WatermelonField.exe out/

          # --- lanzadores .bat (solo líneas de comando, sin código fuente) ---
          printf '@echo off\r\n"%%~dp0WatermelonField.exe" --sim\r\npause\r\n' \
            > out/1_DEMO_sin_hardware.bat

          printf '@echo off\r\n"%%~dp0WatermelonField.exe" --sens 100 --fs 5120 --chans 0,1 --names 1YA,1XA\r\npause\r\n' \
            > out/2_dos_acelerometros.bat

          printf '@echo off\r\n"%%~dp0WatermelonField.exe" --sens 100 --fs 5120 --chans 1,2 --names 1YA,1XA --kph-bnc 1 --machine Rotor_Kit_SIGA_1\r\npause\r\n' \
            > out/3_runup_con_keyphasor.bat

          printf '@echo off\r\n"%%~dp0WatermelonField.exe" --sens 100 --fs 5120 --chans 4,5,6,7 --names 1Y,1X,2Y,2X --kph-bnc 1 --machine Rotor_Kit_SIGA_1\r\npause\r\n' \
            > out/4_cuatro_radiales_2_cojinetes.bat

          # --- SIMULADOR CONFIGURABLE (v0.4): abrí, editá la máquina en Configuración,
          #     Guardar / Aplicar y medir. Arranca con la plantilla motor+bomba. ---
          printf '@echo off\r\nif exist "%%~dp0Nube__EDITAR_credenciales.bat" call "%%~dp0Nube__EDITAR_credenciales.bat"\r\n"%%~dp0WatermelonField.exe" --scenario prox_4brg --fs 5120\r\npause\r\n' \
            > out/0_SIMULADOR_proximidad_4cojinetes.bat

          # --- NUBE: credenciales (el usuario las pega UNA vez) + lanzadores que suben ---
          printf '@echo off\r\nREM  ===  EDITA estas 2 lineas con tu Supabase y guarda  ===\r\nset "WM_SUPABASE_URL=https://TU-PROYECTO.supabase.co"\r\nset "WM_SUPABASE_KEY=TU_SERVICE_KEY_AQUI"\r\n' \
            > out/Nube__EDITAR_credenciales.bat
          printf '@echo off\r\ncall "%%~dp0Nube__EDITAR_credenciales.bat"\r\n"%%~dp0WatermelonField.exe" --scenario prox_4brg --fs 5120\r\npause\r\n' \
            > out/SIMULADOR_con_NUBE.bat
          printf '@echo off\r\ncall "%%~dp0Nube__EDITAR_credenciales.bat"\r\n"%%~dp0WatermelonField.exe" --sens 100 --fs 5120 --chans 0,1 --names 1YA,1XA\r\npause\r\n' \
            > out/MEDIR_acelerometros_con_NUBE.bat

          # --- BANCO DE PRUEBAS: escenarios sim (sin hardware) para probar TODO ---
          mkdir -p out/Banco_de_Pruebas
          scen () { printf '@echo off\r\n"%%~dp0..\\WatermelonField.exe" --fs %s --scenario %s\r\npause\r\n' "$2" "$1" > "out/Banco_de_Pruebas/$3.bat"; }
          scen prox_6brg        5120  "01_proximidad_6cojinetes_orbitas"
          scen prox_runup_whip  5120  "02_arranque_2criticas_oil_whip__Bode_Cascada"
          scen prox_misalign    5120  "03_desalineacion_2X"
          scen prox_looseness   5120  "04_holgura_armonicos"
          scen prox_rub         5120  "05_roce_subarmonicos"
          scen accel_bpfo      25600  "06_acelerometros_falla_BPFO_envelope"
          scen accel_bpfi      25600  "07_acelerometros_falla_BPFI"
          scen accel_bsf       25600  "08_acelerometros_falla_BSF"
          scen gear_mesh       25600  "09_engrane_GMF"
          scen vel_iso_6brg     5120  "10_velocidad_ISO20816"
          scen coastdown        5120  "11_parada_coastdown"
          scen motor_bomba     25600  "12_TREN_motor_rodamientos_+_bomba_cojinetes_planos"

          # --- instrucciones en texto plano (sin algoritmos) ---
          cat > out/LEEME.txt <<'TXT'
          Watermelon Field - modulo nativo de adquisicion (Windows)
          =========================================================

          Requisito unico en la PC: driver NI-DAQmx instalado (de National Instruments).
          NO se necesita Python ni nada mas: el .exe ya trae todo adentro.

          COMO USAR
          ---------
          Doble clic en el .bat segun tu montaje:

            1_DEMO_sin_hardware.bat        -> ver la interfaz sin cDAQ (simulacion)
            2_dos_acelerometros.bat        -> 2 acel. 100 mV/g en Modulo 1 (ai0, ai1)
            3_runup_con_keyphasor.bat      -> keyphasor en Mod1 ai0 + 2 acel. en ai1,ai2
                                              (para Bode / Cascada / diagnostico en arranque)
            4_cuatro_radiales_2_cojinetes.bat -> keyphasor Mod1 ai0 + 4 radiales en Modulo 2

          Tambien podes correr WatermelonField.exe directo (doble clic) = 2 acel. por defecto.

          SIMULADOR (0_SIMULADOR_proximidad_4cojinetes.bat)  <-- DEFAULT recomendado
          -----------------------------------------------------
          Abre la app como una MAQUINA REAL simulada. En la pestaña Configuracion:
            - edita sensores (Canal, Tipo prox/vel/accel/keyphasor, BNC, Sensib, Angulo)
            - elige Modo (estable / arranque / parada / arranque_parada)
            - inyecta fenomenos por tipo de sensor + severidad, criticas, RPM, rampa
            - Guardar en biblioteca  /  Cargar  /  ">>> Aplicar y medir"
          Ademas, arriba tenes el combo MODO para cambiar estable/arranque/parada EN VIVO.
          "Plantilla motor+bomba" carga el tren motor(rodamientos)+bomba(cojinetes planos).

          En la app: Iniciar -> Grabar (opcional) -> mira Monitoreo / Orbita / Bode /
          Cascada / Diagnostico. Detener para terminar.

          Sin internet funciona igual; las grabaciones quedan locales y se suben
          cuando haya conexion (por ahora quedan "local pendiente").

          BANCO DE PRUEBAS (carpeta Banco_de_Pruebas)  <-- SIN cDAQ, todo simulado
          ---------------------------------------------------------------------
          Para desarrollar/probar TODOS los modulos sin hardware. Doble clic:

            01_proximidad_6cojinetes_orbitas        -> 6 cojinetes, orbitas, tabular, forma modal
            02_arranque_2criticas_oil_whip          -> RUNUP: Bode, Cascada, Polar, diagnostico
            03_desalineacion_2X / 04_holgura / 05_roce -> defectos de proximidad
            06_BPFO / 07_BPFI / 08_BSF              -> acelerometros: fallas de rodamiento (envelope)
            09_engrane_GMF                          -> frecuencia de engrane
            10_velocidad_ISO20816                   -> overall en mm/s
            11_parada_coastdown                     -> parada por 2 criticas
            12_TREN_motor_+_bomba                    -> motor (rodamientos, 4 acel, BPFO) +
                                                       bomba (cojinetes planos, 4 proximidades,
                                                       oil whirl), keyphasor comun (fase)

          Son datos sinteticos fisicamente correctos: sirven para afinar graficos,
          alarmas y diagnostico mientras llega la tarjeta de proximidad.

          NUBE: medir en Windows y VER desde la Mac (web)
          -----------------------------------------------
          1) Abri  Nube__EDITAR_credenciales.bat  con Bloc de notas y pega tu
             WM_SUPABASE_URL y WM_SUPABASE_KEY (las mismas del proyecto Supabase).
             Guarda. (Este archivo NO se comparte: son tus credenciales.)
          2) Corre  SIMULADOR_con_NUBE.bat  o  MEDIR_acelerometros_con_NUBE.bat
          3) En la app: Iniciar -> Grabar -> Detener. Al detener la grabacion se
             SUBE a la nube (si hay internet). Sin internet queda local y se sube
             sola la proxima vez que le des Iniciar.
          4) En tu Mac, abri la WEB (Remote Monitoring), misma maquina (mismo
             nombre), y en "Reprocesar grabacion" veras la grabacion con el icono
             de nube; la descarga y la reprocesa a todos los graficos.

          IMPORTANTE: el nombre de la maquina debe coincidir entre Windows y la web
          para que aparezca (es el identificador de la maquina).
          TXT

          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WatermelonField-windows
          path: out/
          retention-days: 30

      # Publica un RELEASE con el .zip → descarga DIRECTA (botón normal, sin login)
      - name: Empaquetar zip para el Release
        if: startsWith(github.ref, 'refs/tags/field-v')
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath WatermelonField-windows.zip -Force

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/field-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" WatermelonField-windows.zip \
            --title "Watermelon Field ${GITHUB_REF_NAME}" \
            --notes "Modulo nativo de campo (Windows). Descargá WatermelonField-windows.zip, descomprimí y corré 0_SIMULADOR_proximidad_4cojinetes.bat (default: proximidad 4 cojinetes, estable/arranque/parada). Requisito: driver NI-DAQmx." \
          || gh release upload "${GITHUB_REF_NAME}" WatermelonField-windows.zip --clobber
