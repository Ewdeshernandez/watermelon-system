name: Build Watermelon Planta Windows Installer

# ============================================================
# FASE K — CI/CD Automatizado para Watermelon Planta
# ============================================================
# Trigger:
#   · Push a main que toque VERSION, planta/, core/modal/ o este workflow
#   · Manualmente desde la UI de GitHub (Actions → Run workflow)
#
# Output:
#   · Artifact descargable: WatermelonPlantaSetup-vX.Y.Z.exe (90 días)
#   · GitHub Release publicado con el .exe como asset
#
# El auto-updater de Planta (planta/updater.py) automáticamente detecta
# el nuevo Release y notifica a los clientes que actualicen.
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'planta/**'
      - 'core/modal/**'
      - 'core/sensor_map.py'
      - '.github/workflows/build-planta.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Forzar creación de GitHub Release (default: true)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Setup.exe en Windows
    runs-on: windows-latest
    permissions:
      contents: write  # necesario para crear releases

    steps:
      # ------------------------------------------------------
      # 1. Checkout del código
      # ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Leer VERSION del repo
      # ------------------------------------------------------
      - name: Leer version del repo
        id: version
        shell: pwsh
        run: |
          $raw = (Get-Content VERSION -Raw).Trim()
          # Normalizar: si no tiene 'v' al principio, agregarla
          if ($raw -notmatch '^v') { $raw = "v$raw" }
          $clean = $raw -replace '^v', ''
          echo "version=$raw" >> $env:GITHUB_OUTPUT
          echo "clean=$clean" >> $env:GITHUB_OUTPUT
          Write-Host "Version del repo: $raw (clean para Inno: $clean)"

      # ------------------------------------------------------
      # 3. Setup Python 3.12 + cache de pip
      #    (el check de release pre-existente lo eliminamos —
      #    softprops/action-gh-release ya maneja el caso de update)
      # ------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: planta/requirements-planta.txt

      # ------------------------------------------------------
      # 5. Instalar dependencias Python (PyInstaller + planta)
      # ------------------------------------------------------
      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r planta/requirements-planta.txt

      # ------------------------------------------------------
      # 5.5. (v3.31.385) PREFLIGHT: verificar que el componente de captura
      #      IMPORTA en el entorno de build ANTES de PyInstaller.
      #      Si nidaqmx/nptdms no importan aquí, collect_all() los omitiría
      #      en silencio y el .exe saldría sin el componente de captura
      #      (bug recurrente "componente de captura pendiente"). Mejor
      #      fallar el build aquí, ruidosamente, que enviar un .exe roto.
      # ------------------------------------------------------
      - name: Preflight — verificar deps de captura
        shell: pwsh
        run: |
          python -c "import nidaqmx; from nidaqmx.system import System; import nptdms; print('OK acq deps importables:', nidaqmx.__version__, nptdms.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "Las dependencias de captura (nidaqmx/nptdms) no importan en el build env. Abortando: el .exe saldria sin el componente de captura."
          }

      # ------------------------------------------------------
      # 6. Verificar / Instalar Inno Setup
      #    GitHub Actions Windows típicamente ya viene con Inno Setup
      #    preinstalado. Solo lo instalamos si no existe.
      # ------------------------------------------------------
      - name: Verificar / Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "✓ Inno Setup ya instalado en: $iscc"
            $version = & $iscc /? | Select-String "Inno Setup" | Select-Object -First 1
            Write-Host "  Version: $version"
          } else {
            Write-Host "Inno Setup no encontrado — instalando con Chocolatey..."
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) {
              throw "Inno Setup no se instaló correctamente"
            }
            Write-Host "✓ Inno Setup instalado en: $iscc"
          }

      # ------------------------------------------------------
      # 6.5. (v3.31.247) Descargar driver del fabricante desde Supabase
      #      Para el bundled installer "Full". El ISO se mantiene cacheado
      #      entre builds — solo se baja cuando cambia DRIVER_VERSION.
      # ------------------------------------------------------
      - name: Cache driver del fabricante (ISO ~3.5 GB)
        id: cache-driver
        uses: actions/cache@v4
        with:
          path: planta/installer/dependencies/driver.iso
          key: driver-iso-${{ env.DRIVER_VERSION }}
        env:
          # Bumpear este valor para forzar re-descarga (ej. cuando subamos
          # un .iso nuevo a Supabase con versión más nueva del driver).
          DRIVER_VERSION: "26.3.0"

      - name: Descargar driver desde Supabase (si no está en cache)
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "${{ secrets.SUPABASE_URL }}/storage/v1/object/watermelon-planta-deps/ni-daqmx_26.3.0_offline.iso"
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
            "apikey"        = "${{ secrets.SUPABASE_SERVICE_KEY }}"
          }
          New-Item -ItemType Directory -Force -Path "planta/installer/dependencies" | Out-Null
          $out = "planta/installer/dependencies/driver.iso"
          Write-Host "Descargando driver desde Supabase Storage..."
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -UseBasicParsing
          $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "✓ Driver descargado: $size MB"

      - name: Extraer contenido del ISO con 7zip
        shell: pwsh
        run: |
          $iso = "planta/installer/dependencies/driver.iso"
          $extractDir = "planta/installer/dependencies/driver-extracted"
          if (-not (Test-Path $iso)) {
            throw "ISO no encontrado en $iso"
          }
          # 7zip viene preinstalado en runners de Windows
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Host "7zip no encontrado, instalando con Chocolatey..."
            choco install 7zip -y --no-progress
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $sevenZip x $iso "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Extracción del ISO falló con código $LASTEXITCODE"
          }
          # Buscar el Install.exe principal (puede estar en raíz o en subdirectorio)
          $installer = Get-ChildItem -Path $extractDir -Recurse -Filter "Install.exe" |
                       Select-Object -First 1
          if (-not $installer) {
            Write-Host "WARNING: Install.exe no encontrado, buscando setup.exe..."
            $installer = Get-ChildItem -Path $extractDir -Recurse -Filter "setup.exe" |
                         Select-Object -First 1
          }
          if (-not $installer) {
            throw "No se encontró Install.exe ni setup.exe en el ISO extraído"
          }
          Write-Host "✓ Driver installer encontrado: $($installer.FullName)"

          # =============================================================
          # v3.31.256 — CRÍTICO: FLATTEN del directorio extraído.
          # Algunos ISOs se extraen con un subdirectorio top-level (ej.
          # 'driver-extracted/nidaqmx_26.3.0/Install.exe'). El installer.iss
          # busca '{tmp}\driver-installer\Install.exe' en el ROOT — si el
          # Install.exe está en un subdir, NUNCA se ejecuta y el driver
          # nunca se instala (sin error visible). Aplanar = mover todo el
          # contenido del subdir al root de driver-extracted/.
          # =============================================================
          $extractRoot = (Get-Item $extractDir).FullName
          $installerDir = $installer.Directory.FullName
          if ($installerDir -ne $extractRoot) {
            Write-Host "Install.exe está en subdir: $installerDir"
            Write-Host "Aplanando: moviendo contenido a $extractRoot"
            Get-ChildItem -Path $installerDir -Force | ForEach-Object {
              $destPath = Join-Path $extractRoot $_.Name
              if (Test-Path $destPath) {
                Remove-Item $destPath -Recurse -Force -ErrorAction SilentlyContinue
              }
              Move-Item -Path $_.FullName -Destination $extractRoot -Force
            }
            # Eliminar el subdir ahora vacío
            Remove-Item -Path $installerDir -Recurse -Force -ErrorAction SilentlyContinue
            # Verificar que Install.exe quedó en el root
            if (-not (Test-Path "$extractRoot\Install.exe")) {
              throw "Install.exe NO quedó en el root despues del flatten"
            }
            Write-Host "✓ Install.exe ahora en root: $extractRoot\Install.exe"
          } else {
            Write-Host "✓ Install.exe ya estaba en el root, no hace falta flatten"
          }

          # Copiar el path al GitHub env (legacy, ya no se usa pero queda)
          $relPath = "dependencies\driver-extracted\Install.exe"
          echo "DRIVER_INSTALLER_PATH=$relPath" >> $env:GITHUB_ENV
          $totalSize = (Get-ChildItem $extractDir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "✓ Tamaño total extraído: $([math]::Round($totalSize / 1GB, 2)) GB"

      # ------------------------------------------------------
      # 6.5 Generar planta/.streamlit/secrets.toml (claves PÚBLICAS)
      #     Sin esto el .exe sale sin credenciales Supabase y el login
      #     OTP truena en campo con "SUPABASE_URL/ANON_KEY no configurados".
      #     Solo url + anon_key (ambos públicos). NUNCA el service_key.
      # ------------------------------------------------------
      - name: Generar secrets.toml para el bundle
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "ERROR: falta el GitHub secret SUPABASE_ANON_KEY."
            echo "Agregalo en Settings -> Secrets and variables -> Actions."
            echo "Valor = Supabase Dashboard -> Settings -> API -> 'anon public'."
            exit 1
          fi
          if [ -z "${SUPABASE_URL}" ]; then
            echo "ERROR: falta el GitHub secret SUPABASE_URL."
            exit 1
          fi
          # Guardia: el anon key debe ser rol 'anon', jamás service_role.
          case "${SUPABASE_ANON_KEY}" in
            *service_role*)
              echo "ERROR: SUPABASE_ANON_KEY parece un service_role key. Usá el 'anon public'."
              exit 1 ;;
          esac
          mkdir -p planta/.streamlit
          cat > planta/.streamlit/secrets.toml <<EOF
          # Generado por CI (build-planta.yml). Claves PÚBLICAS del proyecto
          # Watermelon Cloud: url + anon_key. NO contiene el service_key.
          [supabase]
          url = "${SUPABASE_URL}"
          anon_key = "${SUPABASE_ANON_KEY}"
          EOF
          echo "OK secrets.toml generado (url + anon_key, sin service_key)."

      # ------------------------------------------------------
      # 7. Build .exe portable con PyInstaller
      # ------------------------------------------------------
      - name: Build WatermelonPlanta.exe con PyInstaller
        shell: pwsh
        working-directory: planta/installer
        run: |
          python -m PyInstaller watermelon-planta.spec --clean --noconfirm
          if (-not (Test-Path "dist/WatermelonPlanta.exe")) {
            throw "WatermelonPlanta.exe no se generó"
          }
          $size = [math]::Round((Get-Item "dist/WatermelonPlanta.exe").Length / 1MB, 1)
          Write-Host "✓ WatermelonPlanta.exe generado: $size MB"

      # ------------------------------------------------------
      # 8. Build installer profesional con Inno Setup
      # ------------------------------------------------------
      - name: Build Setup.exe con Inno Setup
        shell: pwsh
        working-directory: planta/installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup falló con código $LASTEXITCODE"
          }
          $setup = Get-ChildItem dist/WatermelonPlantaSetup-*.exe | Select-Object -First 1
          if (-not $setup) {
            throw "WatermelonPlantaSetup-*.exe no se generó"
          }
          $size = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "✓ $($setup.Name) generado: $size MB"
          echo "SETUP_PATH=planta/installer/$($setup.FullName.Substring($setup.FullName.IndexOf('dist')))" >> $env:GITHUB_ENV

      # ------------------------------------------------------
      # 9. Upload .exe Full a Supabase Storage
      #    (v3.31.248) GitHub Releases tiene límite de 2 GB por asset.
      #    Nuestro .exe Full pesa ~3.6 GB (Watermelon + driver embebido).
      #    Por eso lo hosteamos en Supabase Storage privado.
      # ------------------------------------------------------
      - name: Upload .exe Full a Supabase Storage
        id: upload-installer
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          # Buscar el .exe generado por Inno Setup
          SETUP_PATH=$(find planta/installer/dist -name "WatermelonPlantaSetup-*.exe" -type f | head -1)
          if [ -z "$SETUP_PATH" ]; then
            echo "ERROR: WatermelonPlantaSetup-*.exe no encontrado en dist/"
            ls -la planta/installer/dist/ || true
            exit 1
          fi

          FILENAME=$(basename "$SETUP_PATH")
          FILESIZE_BYTES=$(stat -c%s "$SETUP_PATH" 2>/dev/null || stat -f%z "$SETUP_PATH" 2>/dev/null || wc -c < "$SETUP_PATH")
          # v3.31.250: python3 en vez de bc (bc no está en Windows runners)
          FILESIZE_MB=$(python3 -c "print(f'{${FILESIZE_BYTES}/1048576:.1f}')")

          echo "============================================"
          echo "  Archivo a subir:"
          echo "  Path:  $SETUP_PATH"
          echo "  Name:  $FILENAME"
          echo "  Size:  $FILESIZE_MB MB ($FILESIZE_BYTES bytes)"
          echo "============================================"

          # 1) Upload del .exe al bucket privado — con retry + backoff
          # v3.31.257 — Supabase Storage devuelve HTTP 502 inconsistente
          # en uploads de 3.5 GB (timeout del gateway). Reintentamos 4
          # veces con backoff exponencial: 30s, 60s, 120s, 240s.
          UPLOAD_URL="${SUPABASE_URL}/storage/v1/object/watermelon-planta-deps/installers/${FILENAME}"
          HTTP_CODE=""
          UPLOAD_OK="false"

          for ATTEMPT in 1 2 3 4; do
            echo ""
            echo "============================================"
            echo "  Upload attempt $ATTEMPT of 4"
            echo "============================================"
            START_TS=$(date +%s)

            HTTP_CODE=$(curl --silent --show-error \
              --write-out "%{http_code}" \
              --output /tmp/upload_response.json \
              --connect-timeout 30 \
              --max-time 1800 \
              --tcp-nodelay \
              -X POST \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@${SETUP_PATH}" \
              "${UPLOAD_URL}") || HTTP_CODE="000"

            END_TS=$(date +%s)
            ELAPSED=$((END_TS - START_TS))

            echo "HTTP code: $HTTP_CODE (elapsed ${ELAPSED}s)"
            echo "Response body:"
            cat /tmp/upload_response.json 2>/dev/null || echo "(empty)"
            echo ""

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              UPLOAD_OK="true"
              echo "✓ Upload OK en intento $ATTEMPT"
              break
            fi

            if [ "$ATTEMPT" -lt 4 ]; then
              # Backoff exponencial: 30, 60, 120 segundos
              SLEEP_SEC=$((30 * (2 ** (ATTEMPT - 1))))
              echo "✗ Fallo HTTP $HTTP_CODE. Reintentando en ${SLEEP_SEC}s..."
              sleep $SLEEP_SEC
            fi
          done

          if [ "$UPLOAD_OK" != "true" ]; then
            echo "ERROR: Upload falló con HTTP $HTTP_CODE después de 4 intentos"
            echo "Esto puede ser un problema temporal de Supabase Storage."
            echo "Re-correr el workflow puede ayudar (Re-run all jobs)."
            exit 1
          fi

          # 2) Generar signed URL válida 90 días
          SIGN_URL="${SUPABASE_URL}/storage/v1/object/sign/watermelon-planta-deps/installers/${FILENAME}"
          SIGNED_RESPONSE=$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"expiresIn": 7776000}' \
            "${SIGN_URL}")
          echo "Signed URL response: $SIGNED_RESPONSE"

          # Parsear el JSON con Python (más robusto que jq que puede no estar)
          SIGNED_PATH=$(echo "$SIGNED_RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('signedURL', ''))")
          if [ -z "$SIGNED_PATH" ]; then
            echo "ERROR: Signed URL no se generó"
            exit 1
          fi
          FULL_SIGNED_URL="${SUPABASE_URL}/storage/v1${SIGNED_PATH}"
          echo "✓ Signed URL generada (válida 90 días)"

          # Exportar variables al siguiente step
          echo "DOWNLOAD_URL=${FULL_SIGNED_URL}" >> $GITHUB_ENV
          echo "INSTALLER_NAME=${FILENAME}" >> $GITHUB_ENV
          echo "INSTALLER_SIZE_MB=${FILESIZE_MB}" >> $GITHUB_ENV

      # ------------------------------------------------------
      # 10. Crear GitHub Release (SIN asset, solo body con link a Supabase)
      # v3.31.417 — Fallback del tag: en el run #183 el release llegó con
      # tag vacío (softprops cayó a "refs/heads/main" + HttpError). Se relee
      # VERSION en bash justo antes de publicar como respaldo.
      # ------------------------------------------------------
      # v3.31.418 — RETENCIÓN: conservar solo los últimos 5 installers en
      # Supabase Storage. Cada .exe pesa ~3.5 GB y llegaron a acumularse
      # 157 archivos (552 GB) hasta la limpieza manual del 2026-07-02.
      # Best-effort: si falla no tumba el build.
      - name: Retencion de installers (mantener ultimos 5)
        shell: bash
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_KEY"]
          hdr = {"Authorization": f"Bearer {key}", "apikey": key,
                 "Content-Type": "application/json"}

          def call(method, path, payload):
              r = urllib.request.Request(url + path,
                                         data=json.dumps(payload).encode(),
                                         headers=hdr, method=method)
              with urllib.request.urlopen(r, timeout=120) as resp:
                  return json.load(resp)

          files, offset = [], 0
          while True:
              page = call("POST", "/storage/v1/object/list/watermelon-planta-deps",
                          {"prefix": "installers", "limit": 100,
                           "offset": offset})
              files += page
              offset += len(page)
              if len(page) < 100:
                  break

          def ver(n):
              m = re.search(r"v(\d+)\.(\d+)\.(\d+)", n)
              return tuple(map(int, m.groups())) if m else (0, 0, 0)

          exes = sorted((f["name"] for f in files
                         if f["name"].endswith(".exe")), key=ver)
          old = exes[:-5]
          if old:
              call("DELETE", "/storage/v1/object/watermelon-planta-deps",
                   {"prefixes": [f"installers/{n}" for n in old]})
          print(f"Retencion: {len(old)} installer(s) viejos borrados; "
                f"quedan {len(exes) - len(old)}")
          PY

      - name: Version fallback (bash)
        id: version2
        shell: bash
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release con link a Supabase
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version || steps.version2.outputs.version }}
          name: Watermelon Planta ${{ steps.version.outputs.version || steps.version2.outputs.version }}
          body: |
            # 🍉 Watermelon Planta Edition — ${{ steps.version.outputs.version }}

            **Installer profesional para Windows 10/11 64-bit · SIGA GROUP S.A.S**

            ---

            ## 📥 Descargar instalador

            **Archivo**: `${{ env.INSTALLER_NAME }}` (~${{ env.INSTALLER_SIZE_MB }} MB)

            👉 **[DESCARGA DIRECTA](${{ env.DOWNLOAD_URL }})** 👈

            > _Link válido por 90 días desde el build. Si caduca, contactá
            > soporte para uno nuevo._

            ---

            ## Cómo instalar (cliente final)

            1. Click en el link de descarga de arriba (baja ~3.5 GB).
            2. Doble click al `.exe` descargado.
            3. Wizard: **Next → Acepto licencia → Install → Finish**.
            4. Durante la instalación verás "Instalando driver de adquisición
               (10-15 min)..." — esperá, es normal.
            5. Cuando termine, una ventana te pedirá **reiniciar Windows**.
               Hacelo (importante).
            6. Después del reinicio:
               - Conectá la maleta por USB.
               - Pegá tu `license.token` en `C:\Program Files\WatermelonPlanta\data\`.
               - Doble click al ícono Watermelon Planta del escritorio.

            ## Cómo actualizar (cliente existente)

            Bajá el nuevo `.exe`, doble click → reemplaza la instalación previa,
            tus archivos `data/captures/` y `data/license.token` quedan intactos.

            > El auto-updater dentro de la app te avisa automáticamente cuando
            > hay una versión nueva disponible.

            ---

            ## ¿Qué incluye este installer?

            - ✅ Watermelon Planta Edition (app principal)
            - ✅ Driver de adquisición del fabricante (auto-instalado silencioso)
            - ✅ Detección inteligente: si ya tenés el driver, se skipea
            - ✅ Validación de licencia
            - ✅ Auto-updater integrado

            **No necesitás instalar nada más por separado.**

            ---

            ## Soporte

            - 📧 ehernandez@sigasas.com
            - 🌐 https://watermelonsys.net

            ---

            *Build automático generado por GitHub Actions desde commit `${{ github.sha }}`*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # 11. Resumen final
      # ------------------------------------------------------
      - name: Resumen
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "  ✓ BUILD COMPLETO"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "  Version: ${{ steps.version.outputs.version }}"
          Write-Host "  Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
          Write-Host ""
          Write-Host "  El installer está listo para entregar a clientes."
          Write-Host "============================================"
