name: Build Watermelon Planta Windows Installer

# ============================================================
# FASE K — CI/CD Automatizado para Watermelon Planta
# ============================================================
# Trigger:
#   · Push a main que toque VERSION, planta/, core/modal/ o este workflow
#   · Manualmente desde la UI de GitHub (Actions → Run workflow)
#
# Output:
#   · Artifact descargable: WatermelonPlantaSetup-vX.Y.Z.exe (90 días)
#   · GitHub Release publicado con el .exe como asset
#
# El auto-updater de Planta (planta/updater.py) automáticamente detecta
# el nuevo Release y notifica a los clientes que actualicen.
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'planta/**'
      - 'core/modal/**'
      - 'core/sensor_map.py'
      - '.github/workflows/build-planta.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Forzar creación de GitHub Release (default: true)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    name: Build Setup.exe en Windows
    runs-on: windows-latest
    permissions:
      contents: write  # necesario para crear releases

    steps:
      # ------------------------------------------------------
      # 1. Checkout del código
      # ------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Leer VERSION del repo
      # ------------------------------------------------------
      - name: Leer version del repo
        id: version
        shell: pwsh
        run: |
          $raw = (Get-Content VERSION -Raw).Trim()
          # Normalizar: si no tiene 'v' al principio, agregarla
          if ($raw -notmatch '^v') { $raw = "v$raw" }
          $clean = $raw -replace '^v', ''
          echo "version=$raw" >> $env:GITHUB_OUTPUT
          echo "clean=$clean" >> $env:GITHUB_OUTPUT
          Write-Host "Version del repo: $raw (clean para Inno: $clean)"

      # ------------------------------------------------------
      # 3. Setup Python 3.12 + cache de pip
      #    (el check de release pre-existente lo eliminamos —
      #    softprops/action-gh-release ya maneja el caso de update)
      # ------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: planta/requirements-planta.txt

      # ------------------------------------------------------
      # 5. Instalar dependencias Python (PyInstaller + planta)
      # ------------------------------------------------------
      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r planta/requirements-planta.txt

      # ------------------------------------------------------
      # 6. Verificar / Instalar Inno Setup
      #    GitHub Actions Windows típicamente ya viene con Inno Setup
      #    preinstalado. Solo lo instalamos si no existe.
      # ------------------------------------------------------
      - name: Verificar / Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "✓ Inno Setup ya instalado en: $iscc"
            $version = & $iscc /? | Select-String "Inno Setup" | Select-Object -First 1
            Write-Host "  Version: $version"
          } else {
            Write-Host "Inno Setup no encontrado — instalando con Chocolatey..."
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) {
              throw "Inno Setup no se instaló correctamente"
            }
            Write-Host "✓ Inno Setup instalado en: $iscc"
          }

      # ------------------------------------------------------
      # 6.5. (v3.31.247) Descargar driver del fabricante desde Supabase
      #      Para el bundled installer "Full". El ISO se mantiene cacheado
      #      entre builds — solo se baja cuando cambia DRIVER_VERSION.
      # ------------------------------------------------------
      - name: Cache driver del fabricante (ISO ~3.5 GB)
        id: cache-driver
        uses: actions/cache@v4
        with:
          path: planta/installer/dependencies/driver.iso
          key: driver-iso-${{ env.DRIVER_VERSION }}
        env:
          # Bumpear este valor para forzar re-descarga (ej. cuando subamos
          # un .iso nuevo a Supabase con versión más nueva del driver).
          DRIVER_VERSION: "26.3.0"

      - name: Descargar driver desde Supabase (si no está en cache)
        if: steps.cache-driver.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "${{ secrets.SUPABASE_URL }}/storage/v1/object/watermelon-planta-deps/ni-daqmx_26.3.0_offline.iso"
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
            "apikey"        = "${{ secrets.SUPABASE_SERVICE_KEY }}"
          }
          New-Item -ItemType Directory -Force -Path "planta/installer/dependencies" | Out-Null
          $out = "planta/installer/dependencies/driver.iso"
          Write-Host "Descargando driver desde Supabase Storage..."
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out -UseBasicParsing
          $size = [math]::Round((Get-Item $out).Length / 1MB, 1)
          Write-Host "✓ Driver descargado: $size MB"

      - name: Extraer contenido del ISO con 7zip
        shell: pwsh
        run: |
          $iso = "planta/installer/dependencies/driver.iso"
          $extractDir = "planta/installer/dependencies/driver-extracted"
          if (-not (Test-Path $iso)) {
            throw "ISO no encontrado en $iso"
          }
          # 7zip viene preinstalado en runners de Windows
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Host "7zip no encontrado, instalando con Chocolatey..."
            choco install 7zip -y --no-progress
          }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          & $sevenZip x $iso "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Extracción del ISO falló con código $LASTEXITCODE"
          }
          # Buscar el Install.exe principal (puede estar en raíz o en subdirectorio)
          $installer = Get-ChildItem -Path $extractDir -Recurse -Filter "Install.exe" |
                       Select-Object -First 1
          if (-not $installer) {
            Write-Host "WARNING: Install.exe no encontrado, buscando setup.exe..."
            $installer = Get-ChildItem -Path $extractDir -Recurse -Filter "setup.exe" |
                         Select-Object -First 1
          }
          if (-not $installer) {
            throw "No se encontró Install.exe ni setup.exe en el ISO extraído"
          }
          Write-Host "✓ Driver installer encontrado: $($installer.FullName)"
          # Copiar el path al GitHub env para que Inno Setup lo pueda leer
          $relPath = $installer.FullName.Substring((Get-Location).Path.Length + 1)
          echo "DRIVER_INSTALLER_PATH=$relPath" >> $env:GITHUB_ENV
          $totalSize = (Get-ChildItem $extractDir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "✓ Tamaño total extraído: $([math]::Round($totalSize / 1GB, 2)) GB"

      # ------------------------------------------------------
      # 7. Build .exe portable con PyInstaller
      # ------------------------------------------------------
      - name: Build WatermelonPlanta.exe con PyInstaller
        shell: pwsh
        working-directory: planta/installer
        run: |
          python -m PyInstaller watermelon-planta.spec --clean --noconfirm
          if (-not (Test-Path "dist/WatermelonPlanta.exe")) {
            throw "WatermelonPlanta.exe no se generó"
          }
          $size = [math]::Round((Get-Item "dist/WatermelonPlanta.exe").Length / 1MB, 1)
          Write-Host "✓ WatermelonPlanta.exe generado: $size MB"

      # ------------------------------------------------------
      # 8. Build installer profesional con Inno Setup
      # ------------------------------------------------------
      - name: Build Setup.exe con Inno Setup
        shell: pwsh
        working-directory: planta/installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup falló con código $LASTEXITCODE"
          }
          $setup = Get-ChildItem dist/WatermelonPlantaSetup-*.exe | Select-Object -First 1
          if (-not $setup) {
            throw "WatermelonPlantaSetup-*.exe no se generó"
          }
          $size = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "✓ $($setup.Name) generado: $size MB"
          echo "SETUP_PATH=planta/installer/$($setup.FullName.Substring($setup.FullName.IndexOf('dist')))" >> $env:GITHUB_ENV

      # ------------------------------------------------------
      # 9. Upload .exe Full a Supabase Storage
      #    (v3.31.248) GitHub Releases tiene límite de 2 GB por asset.
      #    Nuestro .exe Full pesa ~3.6 GB (Watermelon + driver embebido).
      #    Por eso lo hosteamos en Supabase Storage privado.
      # ------------------------------------------------------
      - name: Upload .exe Full a Supabase Storage
        id: upload-installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem planta/installer/dist/WatermelonPlantaSetup-*.exe |
                   Select-Object -First 1
          if (-not $setup) {
            throw "WatermelonPlantaSetup-*.exe no encontrado en dist/"
          }
          $fileName = $setup.Name
          $fileSize = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "Subiendo $fileName ($fileSize MB) a Supabase Storage..."

          # Upload con curl (más confiable que Invoke-WebRequest para archivos grandes)
          $url = "${{ secrets.SUPABASE_URL }}/storage/v1/object/watermelon-planta-deps/installers/$fileName"
          $result = & curl.exe --silent --show-error --fail `
            -X POST `
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" `
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" `
            -H "Content-Type: application/octet-stream" `
            -H "x-upsert: true" `
            --data-binary "@$($setup.FullName)" `
            $url
          if ($LASTEXITCODE -ne 0) {
            throw "Upload a Supabase falló con código $LASTEXITCODE: $result"
          }
          Write-Host "✓ Upload OK: $result"

          # Generar signed URL válida por 90 días para que clientes descarguen
          $signedUrlBody = '{"expiresIn": 7776000}'  # 90 días en segundos
          $signedResp = & curl.exe --silent --show-error --fail `
            -X POST `
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" `
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" `
            -H "Content-Type: application/json" `
            -d $signedUrlBody `
            "${{ secrets.SUPABASE_URL }}/storage/v1/object/sign/watermelon-planta-deps/installers/$fileName"
          if ($LASTEXITCODE -ne 0) {
            throw "Signed URL generation falló: $signedResp"
          }
          # Parsear JSON response: {"signedURL": "/object/sign/..."}
          $signed = $signedResp | ConvertFrom-Json
          $fullSignedUrl = "${{ secrets.SUPABASE_URL }}/storage/v1$($signed.signedURL)"
          Write-Host "✓ Signed URL generada (válida 90 días)"
          echo "DOWNLOAD_URL=$fullSignedUrl" >> $env:GITHUB_ENV
          echo "INSTALLER_NAME=$fileName" >> $env:GITHUB_ENV
          echo "INSTALLER_SIZE_MB=$fileSize" >> $env:GITHUB_ENV

      # ------------------------------------------------------
      # 10. Crear GitHub Release (SIN asset, solo body con link a Supabase)
      # ------------------------------------------------------
      - name: Publicar GitHub Release con link a Supabase
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Watermelon Planta ${{ steps.version.outputs.version }}
          body: |
            # 🍉 Watermelon Planta Edition — ${{ steps.version.outputs.version }}

            **Installer profesional para Windows 10/11 64-bit · SIGA GROUP S.A.S**

            ---

            ## 📥 Descargar instalador

            **Archivo**: `${{ env.INSTALLER_NAME }}` (~${{ env.INSTALLER_SIZE_MB }} MB)

            👉 **[DESCARGA DIRECTA](${{ env.DOWNLOAD_URL }})** 👈

            > _Link válido por 90 días desde el build. Si caduca, contactá
            > soporte para uno nuevo._

            ---

            ## Cómo instalar (cliente final)

            1. Click en el link de descarga de arriba (baja ~3.5 GB).
            2. Doble click al `.exe` descargado.
            3. Wizard: **Next → Acepto licencia → Install → Finish**.
            4. Durante la instalación verás "Instalando driver de adquisición
               (10-15 min)..." — esperá, es normal.
            5. Cuando termine, una ventana te pedirá **reiniciar Windows**.
               Hacelo (importante).
            6. Después del reinicio:
               - Conectá la maleta por USB.
               - Pegá tu `license.token` en `C:\Program Files\WatermelonPlanta\data\`.
               - Doble click al ícono Watermelon Planta del escritorio.

            ## Cómo actualizar (cliente existente)

            Bajá el nuevo `.exe`, doble click → reemplaza la instalación previa,
            tus archivos `data/captures/` y `data/license.token` quedan intactos.

            > El auto-updater dentro de la app te avisa automáticamente cuando
            > hay una versión nueva disponible.

            ---

            ## ¿Qué incluye este installer?

            - ✅ Watermelon Planta Edition (app principal)
            - ✅ Driver de adquisición del fabricante (auto-instalado silencioso)
            - ✅ Detección inteligente: si ya tenés el driver, se skipea
            - ✅ Validación de licencia
            - ✅ Auto-updater integrado

            **No necesitás instalar nada más por separado.**

            ---

            ## Soporte

            - 📧 ehernandez@sigasas.com
            - 🌐 https://watermelonsys.net

            ---

            *Build automático generado por GitHub Actions desde commit `${{ github.sha }}`*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------
      # 11. Resumen final
      # ------------------------------------------------------
      - name: Resumen
        shell: pwsh
        run: |
          Write-Host "============================================"
          Write-Host "  ✓ BUILD COMPLETO"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "  Version: ${{ steps.version.outputs.version }}"
          Write-Host "  Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}"
          Write-Host ""
          Write-Host "  El installer está listo para entregar a clientes."
          Write-Host "============================================"
