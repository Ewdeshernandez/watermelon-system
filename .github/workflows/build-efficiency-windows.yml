name: build-efficiency-windows

# Compila native/watermelon_efficiency.py a .exe Windows (onedir) + instalador Inno.
# Disparar:  git tag efficiency-vX.Y.Z && git push origin efficiency-vX.Y.Z

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'efficiency-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias + PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy "PySide6>=6.6" "pyqtgraph>=0.13" nidaqmx nitypes hightime supabase reportlab pillow certifi cryptography pyinstaller

      - name: Embeber credenciales de nube (desde GitHub Secrets)
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL = "%s"\nSUPABASE_KEY = "%s"\n' "$SB_URL" "$SB_KEY" \
            > core/remote_monitoring/_cloud_config.py

      - name: Compilar WatermelonEfficiency.exe (onedir)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name WatermelonEfficiency \
            --windowed \
            --contents-directory _internal \
            --paths . \
            --paths native \
            --collect-submodules core.efficiency \
            --collect-submodules core.torsional \
            --collect-submodules core.remote_monitoring \
            --hidden-import core.efficiency.engine \
            --hidden-import core.efficiency.cloud \
            --hidden-import core.efficiency.updater \
            --hidden-import core.torsional.ni_source \
            --hidden-import core.torsional.analysis \
            --hidden-import license_gate \
            --hidden-import core.modal.licensing \
            --hidden-import core.modal.preliminary_report \
            --collect-submodules nidaqmx \
            --hidden-import nidaqmx \
            --copy-metadata nidaqmx \
            --collect-all nitypes \
            --copy-metadata nitypes \
            --copy-metadata hightime \
            --hidden-import reportlab \
            --collect-submodules reportlab \
            --hidden-import core.remote_monitoring._cloud_config \
            --collect-all cryptography \
            --hidden-import cryptography \
            --hidden-import certifi \
            --copy-metadata certifi \
            --collect-data certifi \
            --hidden-import PIL \
            --add-data "assets/watermelon_logo.png;assets" \
            --icon "assets/watermelon.ico" \
            --collect-submodules scipy \
            --collect-all supabase \
            --copy-metadata supabase \
            --hidden-import deprecation \
            --exclude-module streamlit \
            --exclude-module matplotlib \
            --exclude-module pandas \
            native/watermelon_efficiency.py

      - name: Empaquetar binario + lanzador
        shell: bash
        run: |
          mkdir -p out_efficiency
          cp -r dist/WatermelonEfficiency/. out_efficiency/
          printf '@echo off\r\n"%%~dp0WatermelonEfficiency.exe" --sim\r\npause\r\n' \
            > out_efficiency/0_SIMULADOR_efficiency.bat
          cat > out_efficiency/LEEME.txt <<'TXT'
          Watermelon Efficiency - eficiencia de maquinas rotatorias (campo)
          =================================================================
          P_mec = T.w/1000 (TorqueTrak 10K + keyphasor) ; P_elec = raiz3.V.I.cosfi/1000.
          eta_motor, eta_operativa (semaforo) y eta por tipo (bomba/ventilador/
          compresor/turbina). Datos manuales, simulado o NI (TorqueTrak + keyphasor).
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: WatermelonEfficiency-windows
          path: out_efficiency/
          retention-days: 30

      - name: Instalar Inno Setup
        if: startsWith(github.ref, 'refs/tags/efficiency-v')
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compilar instalador
        if: startsWith(github.ref, 'refs/tags/efficiency-v')
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^efficiency-v',''
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem "C:\Program Files (x86)","C:\Program Files" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $iscc) { "ISCC.exe NOT FOUND" | Tee-Object installer_log.txt; exit 0 }
          & $iscc "/DMyAppVersion=$ver" "native/installer/watermelon_efficiency.iss" 2>&1 | Tee-Object installer_log.txt

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/efficiency-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ASSETS=""
          [ -f WatermelonEfficiency-Setup.exe ] && ASSETS="WatermelonEfficiency-Setup.exe"
          [ -f installer_log.txt ] && ASSETS="$ASSETS installer_log.txt"
          gh release create "${GITHUB_REF_NAME}" $ASSETS \
            --title "Watermelon Efficiency ${GITHUB_REF_NAME}" \
            --notes "Watermelon Efficiency — eficiencia de maquinas rotatorias (Windows). Instalador: WatermelonEfficiency-Setup.exe. Sin firmar aun -> SmartScreen puede pedir confirmacion." \
          || for a in $ASSETS; do gh release upload "${GITHUB_REF_NAME}" "$a" --clobber; done
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest || true
