name: Live Monitoring — reportes automáticos

# Hace que el módulo Live Monitoring trabaje SOLO, sin especialista:
#   - ALARMA/DANGER: cada 15 min evalúa severidad y avisa al ENTRAR/ESCALAR
#     (anti-spam: 1 aviso por episodio). scripts/send_alarm_reports.py
#   - DIARIO/PROGRAMADO: cada hora en punto; envía a los activos cuya
#     hora/día programados coinciden. scripts/send_scheduled_reports.py
#   - SEMANAL: lunes 07:00 Colombia; briefing por activo AUTO-ENVIADO al
#     cliente sin aprobación humana (--auto-send). scripts/send_weekly_briefing.py
#
# Requiere UN secret de repo: STREAMLIT_SECRETS_TOML = contenido completo de
# .streamlit/secrets.toml (secciones [supabase], [email], [whatsapp]). Se
# escribe en el runner al vuelo; los scripts lo leen igual que en la app.
# El repo es público → minutos de Actions gratis.

on:
  schedule:
    - cron: '*/15 * * * *'   # ALARMA — cada 15 min
    - cron: '0 * * * *'      # PROGRAMADO/diario — cada hora en punto
    - cron: '0 12 * * 1'     # SEMANAL — lunes 12:00 UTC = 07:00 America/Bogota
  workflow_dispatch:
    inputs:
      job:
        description: 'Qué correr manualmente'
        type: choice
        options: [alarm, scheduled, weekly, all]
        default: alarm
      dry_run:
        description: 'dry-run (no envía)'
        type: boolean
        default: true

concurrency:
  group: live-auto-reports-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  alarm:
    name: Alarma / Danger (cada 15 min)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'alarm' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Write secrets.toml
        id: sec
        env:
          TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          if [ -z "$TOML" ]; then echo "::warning::Falta STREAMLIT_SECRETS_TOML — skip envio."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p .streamlit && printf '%s' "$TOML" > .streamlit/secrets.toml
      - name: Run alarm reports
        if: steps.sec.outputs.skip != 'true'
        run: python scripts/send_alarm_reports.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

  scheduled:
    name: Programado / Diario (cada hora)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'scheduled' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Write secrets.toml
        id: sec
        env:
          TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          if [ -z "$TOML" ]; then echo "::warning::Falta STREAMLIT_SECRETS_TOML — skip envio."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p .streamlit && printf '%s' "$TOML" > .streamlit/secrets.toml
      - name: Run scheduled reports
        if: steps.sec.outputs.skip != 'true'
        run: python scripts/send_scheduled_reports.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

  weekly:
    name: Briefing semanal AUTO (lunes)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'weekly' || inputs.job == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Write secrets.toml
        id: sec
        env:
          TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          if [ -z "$TOML" ]; then echo "::warning::Falta STREAMLIT_SECRETS_TOML — skip envio."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p .streamlit && printf '%s' "$TOML" > .streamlit/secrets.toml
      - name: Run weekly briefing (auto-send)
        if: steps.sec.outputs.skip != 'true'
        run: python scripts/send_weekly_briefing.py --period Semanal --auto-send ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
