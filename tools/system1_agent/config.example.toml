# =====================================================================
# Watermelon System1 Agent · config
# Copia este archivo como  config.toml  y llena los valores.
# NO subas config.toml a git (lleva credenciales).
# =====================================================================

# Activo (equipo) al que pertenecen estas capturas. DEBE coincidir con el
# instance_id que usa Watermelon Live (el mismo del colector Modbus estático).
# Para el tren SGT300 B ese id es turbina_sgt300_b. La vista web resuelve por
# instance_id/tag, así que usar el id exacto garantiza el match.
asset = "turbina_sgt300_b"

# ---------------------------------------------------------------------
# Supabase (destino). Usa el SERVICE KEY (server-side, bypass RLS).
# Alternativa recomendada: exportar por variables de entorno en el server
#   SUPABASE_URL / SUPABASE_SERVICE_KEY  (así no queda la key en disco).
# ---------------------------------------------------------------------
[supabase]
url = "https://yxeqwkhybueelmkrdkgq.supabase.co"
service_key = "PONER_SERVICE_ROLE_KEY_AQUI"

# ---------------------------------------------------------------------
# DemoReader (para probar el pipeline sin la DB real): python s1_agent.py --demo --once
# ---------------------------------------------------------------------
[demo]
points = ["CDE", "CNDE", "TDE", "TNDE", "GDE", "GNDE"]
rpm = 9000.0

# ---------------------------------------------------------------------
# System1 (producción). Rellenar tras correr:  python s1_agent.py --discover
# ---------------------------------------------------------------------
# VERIFICADO en el server Parex (2026-09-21):
#   El backend de System1 es SQL SERVER (MSSQLSERVER), escucha en 1433.
#   Base de datos = BNC_Databases  (Bently Nevada, el historian de System1).
#   Responde con WINDOWS AUTHENTICATION (sin password) corriendo en la misma
#   máquina. PostgreSQL 14 también está instalado pero NO escucha TCP: no es
#   el backend de System1.
[system1]
server = "localhost"
database = "BNC_Databases"
trusted = true                 # Windows Auth (sin password) — el agente corre en el server
driver = "ODBC Driver 17 for SQL Server"   # o "ODBC Driver 11 for SQL Server" (instalado)
# Si algún día se usa SQL login en vez de Windows Auth:
#   trusted = false
#   user = "watermelon_ro"
#   password = "..."
# puntos a extraer (cojinetes) tal como aparecen en System1
points = ["CDE", "CNDE", "TDE", "TNDE", "GDE", "GNDE"]

# Query de extracción incremental (T-SQL). Debe devolver filas:
#   point, channel, captured_at, unit, rpm, fs_hz, samples_per_rev, sample_index, value
# ordenadas por (point, captured_at, channel, sample_index).
# Placeholders posicionales `?` en ORDEN: (since, point).
# EDITAR con los nombres reales de tabla/columna que muestre --discover.
# NOTA: System1 suele guardar la onda como BLOB binario (VARBINARY) por
# waveform, no fila-por-muestra. Si es así, la query trae el blob + metadatos y
# habrá que decodificarlo (tarea de mapeo del formato Bently).
[system1.query]
sql = """
-- PLANTILLA — ajustar a la tabla real de waveforms de System1 (BNC_Databases)
-- SELECT p.Name AS point, c.Name AS channel, w.Timestamp AS captured_at,
--        c.Unit AS unit, w.Rpm AS rpm, w.SampleRate AS fs_hz,
--        w.SamplesPerRev AS samples_per_rev, s.Idx AS sample_index, s.Value AS value
-- FROM   Waveform w
-- JOIN   Channel c ON c.Id = w.ChannelId
-- JOIN   Point   p ON p.Id = c.PointId
-- JOIN   Sample  s ON s.WaveformId = w.Id
-- WHERE  w.Timestamp > ? AND p.Name = ?
-- ORDER  BY w.Timestamp, c.Name, s.Idx;
"""
