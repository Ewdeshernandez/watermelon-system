<!doctype html>
<!--
  Shim del componente Streamlit (web). Carga la página compartida del campo
  (builder.html o config.html — fuente única) y traduce su puente postMessage
  ↔ protocolo de componentes Streamlit. El campo (PySide6) NO usa este archivo.

  args: page  ("builder.html" | "config.html")
        skin  ("light" | "dark")
        nonce (cambia cuando Python quiere empujar algo nuevo)
        spec  (builder: tren a cargar)
        msgs  (config: lista de mensajes host→página a entregar con ese nonce)
  valor: {wm:'build'|'action', ..., ts}
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  iframe{border:0;width:100%;height:900px;display:block}
</style>
</head>
<body>
<iframe id="b" title="Watermelon"></iframe>
<script>
(function(){
  var fr = document.getElementById('b');
  var ready = false, page = null, skin = null, mode = null, lastNonce = null, pending = null, live = null;

  function toST(type, extra){
    var m = {isStreamlitMessage: true, apiVersion: 1, type: type};
    for (var k in (extra || {})) m[k] = extra[k];
    window.parent.postMessage(m, '*');
  }
  function deliver(){
    if (!ready || !pending) return;
    var p = pending; pending = null;
    if (page === 'builder.html'){
      if (p.spec && p.spec.machines && p.spec.machines.length) fr.contentWindow.postMessage({wm: 'load', spec: p.spec}, '*');
      if (live) fr.contentWindow.postMessage({wm: 'live', data: live}, '*');
    } else {
      (p.msgs || []).forEach(function(m){ fr.contentWindow.postMessage(m, '*'); });
    }
  }
  fr.addEventListener('load', function(){ if (page === 'builder.html'){ ready = true; deliver(); } });

  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (e.source === fr.contentWindow){
      if (d.wm === 'size' && d.h){
        var h = Math.max(page === 'builder.html' ? (mode === 'live' ? 260 : 520) : 400, Math.ceil(d.h));
        fr.style.height = h + 'px';
        toST('streamlit:setFrameHeight', {height: h});
      } else if (d.wm === 'ready'){
        ready = true; deliver();
      } else if (d.wm === 'build' || d.wm === 'action'){
        var v = {}; for (var k in d) v[k] = d[k]; v.ts = Date.now();
        toST('streamlit:setComponentValue', {value: v, dataType: 'json'});
      }
      return;
    }
    if (d.type === 'streamlit:render'){
      var a = d.args || {};
      var wantPage = a.page || 'builder.html';
      var wantSkin = (a.skin === 'dark' ? 'dark' : 'light');
      var wantMode = a.mode || '';
      if (wantPage !== page || wantSkin !== skin || wantMode !== mode){
        page = wantPage; skin = wantSkin; mode = wantMode; ready = false; lastNonce = null;
        var hash = page === 'config.html' ? (skin === 'light' ? 'web-light' : 'web') :
                   ((mode === 'live' ? 'view-' : '') + (skin === 'light' ? 'light-embed' : 'embed') + (mode === 'live' ? '-live' : ''));
        fr.src = page + '#' + hash;
      }
      // Modo en vivo: los valores llegan en CADA render (sin recargar el tren).
      if (a.live){ live = a.live; if (ready && a.nonce === lastNonce) fr.contentWindow.postMessage({wm: 'live', data: live}, '*'); }
      if (a.nonce !== lastNonce){
        lastNonce = a.nonce;
        pending = {spec: a.spec, msgs: a.msgs};
        deliver();
      }
    }
  });
  toST('streamlit:componentReady');
  toST('streamlit:setFrameHeight', {height: 900});
})();
</script>
</body>
</html>
