<!doctype html>
<!--
  Watermelon · Machine configuration (7 steps) — FUENTE ÚNICA campo + web.
    Campo (PySide6/QWebEngine): config.html            (piel oscura)
    Web   (Streamlit component): config.html#web-light (piel clara)
  Solo dibuja/edita. La lógica (defaults, merge del constructor, validación API 670,
  versiones) vive en Python: core/remote_monitoring/config_bridge.py.
  Puente:
    host → página  window.wmReceive({wm:'init'|'setup'|'findings'|'versions'|'toast', ...})
                   (web: postMessage del shim padre)
    página → host  web: parent.postMessage({wm:'action'|'changed'|'size', ...})
                   campo: cola window.__wm_out (Python la vacía por polling)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine configuration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --f-sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-cond:'IBM Plex Sans Condensed','IBM Plex Sans','Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',Consolas,ui-monospace,Menlo,monospace;
  --c-prox:#8b5cf6;--c-vel:#22b8cf;--c-accel:#ef4444;--c-kph:#f59e0b;
  /* piel CAMPO (oscura, instrumento) */
  --bg:#0a1016;--panel:#111f2e;--panel2:#15273a;--line:#1f344a;--ink:#e8f0f8;--mute:#8aa0b6;--dim:#5d7189;
  --chrome:#132436;--accent:#34c6e8;--go:#10b981;--next:#1AAEE5;--warn:#f0a63a;--err:#f26b6b;--ok:#34d399;
  --input:#0c1824;--rail:#0e1823;--sel:#15273a;color-scheme:dark}
body.light{--bg:#f4f7fb;--panel:#ffffff;--panel2:#eef3f9;--line:#dde4ee;--ink:#0b1f3a;--mute:#4f6177;--dim:#8494a8;
  --chrome:#12305e;--accent:#1c79b4;--go:#1f9d55;--next:#1c79b4;--warn:#b45309;--err:#b42318;--ok:#1f7a47;
  --input:#ffffff;--rail:#ffffff;--sel:#eaf2fb;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.45}
body.web{background:transparent}
.app{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
body.web .app{min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--chrome);color:#eaf1fb;padding:10px 16px}
.topbar .brand{font-family:var(--f-cond);font-weight:700;letter-spacing:.04em;font-size:14px}
.topbar .brand small{font-family:var(--f-sans);font-weight:500;opacity:.7;letter-spacing:0;margin-left:6px}
.topbar .mach{font-family:var(--f-mono);font-size:12.5px;opacity:.9}
.topbar .sp{flex:1}
.badge{font:700 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid}
.badge.online{background:#4ade80;color:#052e16;border-color:#16a34a}
.badge.spot{background:#1e3a5f;color:#cfe3f7;border-color:#3b6590}
.badge.src{background:transparent;color:#cfe3f7;border-color:rgba(207,227,247,.35)}
.badge.ver{background:transparent;color:#cfe3f7;border-color:rgba(207,227,247,.35)}
.body{display:grid;grid-template-columns:212px minmax(0,1fr);gap:12px;padding:12px;flex:1}
@media (max-width:820px){.body{grid-template-columns:1fr}}
.rail{background:var(--rail);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;align-self:start}
@media (max-width:820px){.rail{flex-direction:row;overflow-x:auto}}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;
  color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap;border-left:3px solid transparent}
.rail button .n{font-family:var(--f-mono);font-size:11.5px;width:16px;text-align:right;opacity:.8}
.rail button:hover:not([disabled]){background:var(--panel2)}
.rail button.on{background:var(--sel);color:var(--ink);border-left-color:var(--accent);padding-left:9px}
.rail button[disabled]{color:var(--dim);opacity:.55;cursor:not-allowed}
.rail button .lk{margin-left:auto;font-size:10px;opacity:.7;font-family:var(--f-mono)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.main{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.sub{color:var(--dim);font:700 10px var(--f-sans);letter-spacing:.09em;text-transform:uppercase;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.fld{display:flex;align-items:center;gap:8px;min-width:0}
.fld label{color:var(--mute);font-size:12.5px;white-space:nowrap}
.fld.grow{flex:1 1 220px}
input,select{font:500 13px var(--f-sans);color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=number]{width:96px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fld.grow input,.fld.grow select{flex:1;min-width:0}
input[type=checkbox]{accent-color:var(--accent)}
.btn{font:700 12.5px var(--f-sans);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.next{background:var(--next);border-color:var(--next);color:#fff}
.btn.red{background:#f5484a;border-color:#f5484a;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:11.5px}
.hint{color:var(--mute);font-size:12.5px;font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.frame{width:100%;border:0;display:block;border-radius:10px;background:transparent}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font:700 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.sel td{background:var(--sel)}
.pick tbody tr{cursor:pointer}
td.lbl{font-family:var(--f-mono);font-weight:600}
td input,td select{padding:3px 6px;font-size:12px}
td input[type=number]{width:70px}
.mb{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.callout{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--mute);font-size:13px}
.callout b{color:var(--ink)}
.grp{display:flex;flex-direction:column;gap:8px}
.dialwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.findings{display:flex;flex-direction:column;gap:6px;font-size:13px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.fi .s{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--dim)}
.fi.error .s{background:var(--err)}.fi.warn .s{background:var(--warn)}.fi.ok .s{background:var(--ok)}
.fi code{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap}
.vsum{font-weight:700;font-size:14px}
.vsum.error{color:var(--err)}.vsum.warn{color:var(--warn)}.vsum.ok{color:var(--ok)}
.sumhdr{background:var(--chrome);color:#fff;border-radius:10px;padding:12px 16px}
.sumhdr .t{font-size:17px;font-weight:700}
.sumhdr .t span{color:#8ec3ef;font-weight:500;font-size:14px;margin-left:8px}
.sumhdr .m{color:#b7c6de;font-size:12px;margin-top:2px;font-family:var(--f-mono)}
.vers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vr{display:grid;grid-template-columns:54px 96px 60px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.vr:last-child{border-bottom:0}
.vr .v{font:700 13px var(--f-mono)}
.vr .acts{display:flex;gap:6px;align-items:center}
.pill{font:700 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);justify-self:start}
.pill.published{color:var(--ok);border-color:currentColor}.pill.draft{color:var(--warn);border-color:currentColor}
.pill.superseded,.pill.rejected{opacity:.65}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.actions .sp{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1f3a;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:20;max-width:90vw}
.loading{padding:40px;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="brand">WATERMELON<small>Rotordynamics · Configuration</small></span>
    <span class="mach" id="tbMach"></span>
    <span class="sp"></span>
    <span class="badge ver" id="tbVer" hidden></span>
    <span class="badge src" id="tbSrc"></span>
    <span class="badge spot" id="tbMode"></span>
  </div>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Configuration steps"></nav>
    <section class="main" id="main" aria-live="polite"><div class="loading">Loading configuration…</div></section>
  </div>
  <div class="actions" id="actions"></div>
</div>
<script>
(function(){
'use strict';
var HASH=location.hash||'';
var HOST=/web/.test(HASH)?'web':'field';
if(/light/.test(HASH)) document.body.classList.add('light');
document.body.classList.add(HOST);

var STEPS=['Machine','Constructor','Sensors & layout','Channel editor','Acquisition','Validation','Summary'];
var TYPES=['proximity','velometer','accelerometer','keyphasor'];
var KNAME={proximity:'Proximity',velometer:'Velocity',accelerometer:'Accelerometer',keyphasor:'Keyphasor'};
var KCOL={proximity:'var(--c-prox)',velometer:'var(--c-vel)',accelerometer:'var(--c-accel)',keyphasor:'var(--c-kph)'};
var MODES=[['estable','Steady'],['arranque','Startup'],['parada','Coastdown'],['arranque_parada','Startup / Coastdown']];
var FAM={proximity:'prox',velometer:'vel',accelerometer:'accel'};

var S=null, LIB=[], V=[], D={types:{},units:{}}, CUR='', unlocked=0, built=false, step=0, selCh=0;
var FIND=null, REPORT=null, pendingDel=null, bFrame=null, vFrame=null;

// ---------------- bridge ----------------
function send(msg){
  msg.wm=msg.wm||'action';
  if(window.parent && window.parent!==window){ try{ window.parent.postMessage(msg,'*'); }catch(e){} }
  else { (window.__wm_out=window.__wm_out||[]).push(JSON.stringify(msg)); }
}
function act(name,extra){var m={wm:'action',name:name,setup:S};for(var k in (extra||{}))m[k]=extra[k];send(m);}
var _chg=null;
function changed(){ if(HOST!=='field') return; clearTimeout(_chg); _chg=setTimeout(function(){send({wm:'changed',setup:S});},400); }
window.wmReceive=function(m){
  if(typeof m==='string'){ try{ m=JSON.parse(m); }catch(e){ return; } }
  if(!m||!m.wm) return;
  if(m.wm==='init'){
    S=m.setup; LIB=m.library||[]; V=m.versions||[]; D=m.defaults||D; CUR=m.current||'';
    unlocked=(m.unlocked==null?6:m.unlocked); built=!!m.built; step=(m.step==null?0:m.step);
    selCh=0; FIND=null; REPORT=null; render();
  } else if(m.wm==='setup'){
    S=m.setup; if(m.report){ REPORT=m.report; built=true; unlocked=Math.max(unlocked,2); }
    if(selCh>=S.channels.length) selCh=0; FIND=null; render(); changed();
  } else if(m.wm==='findings'){ FIND=m.findings||[]; if(step===5) stepValidation(); renderActions(); }
  else if(m.wm==='versions'){ V=m.versions||[]; render(); }
  if(m.toast) toast(m.toast);
  if(m.wm==='toast') toast(m.text||'');
};
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(bFrame && e.source===bFrame.contentWindow){
    if(d.wm==='size'&&d.h) bFrame.style.height=Math.max(560,d.h)+'px';
    if(d.wm==='build') act('build',{spec:d.spec});
    return;
  }
  if(vFrame && e.source===vFrame.contentWindow){ if(d.wm==='size'&&d.h) vFrame.style.height=Math.max(260,Math.min(d.h,460))+'px'; return; }
  if(e.source===window.parent && d.wm) window.wmReceive(d);
});
var _lastH=0;
setInterval(function(){ if(HOST!=='web') return; var h=document.getElementById('app').scrollHeight+4;
  if(Math.abs(h-_lastH)>2){ _lastH=h; send({wm:'size',h:h}); } },250);

// ---------------- helpers ----------------
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function disp(l){return (l||'').replace(/_/g,'');}
function canon(n){var m=/^(\d+)([XYHVZ])D([ab]?)$/i.exec((n||'').trim());return m?m[1]+m[2].toUpperCase()+'_D'+m[3].toLowerCase():(n||'').trim();}
function toast(t){if(!t)return;var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},3000);}
function num(v){var f=parseFloat(v);return isNaN(f)?0:f;}
function fld(lbl,html,grow){return '<div class="fld'+(grow?' grow':'')+'">'+(lbl?'<label>'+lbl+'</label>':'')+html+'</div>';}
function inp(id,val,type,extra){return '<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" '+(extra||'')+'>';}
function sel(id,opts,val){return '<select id="'+id+'">'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;
  return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select>';}
function on(id,ev,fn){var e=$(id);if(e)e.addEventListener(ev,fn);}
function bindv(id,fn,isNum){on(id,'change',function(e){fn(isNum?num(e.target.value):e.target.value);changed();refreshTop();});}
function M(){return S.machine;}
function gw(){S.modbus_gateway=S.modbus_gateway||{};S.modbus_gateway.modbus=S.modbus_gateway.modbus||{};return S.modbus_gateway;}
function nBearings(){var n=0;((S.layout||{}).machines||[]).forEach(function(m){n+=(m.bearings||0);});return n||M().n_bearings||0;}
function bandOf(t){var b=(S.acquisition_by_type||{})[t]||{};return b;}
function autoFs(){var f=(M().rpm_nominal||0)/60*12;var std=[2560,5120,12800,25600];for(var i=0;i<std.length;i++){if(std[i]/2.56>=f)return std[i];}return 25600;}
function pubV(){var p=V.filter(function(v){return v.st==='published';})[0];return p?p.v:null;}
function hasDraftField(){return V.some(function(v){return v.st==='draft'&&v.org==='field';});}

// ---------------- rail + gating ----------------
function renderRail(){
  var r=$('rail');r.innerHTML='';
  STEPS.forEach(function(nm,i){
    var b=document.createElement('button');b.type='button';
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+esc(nm)+(i>unlocked?'<span class="lk">locked</span>':'');
    if(i===step) b.className='on';
    if(i>unlocked){b.disabled=true;b.title='Complete the previous steps first';}
    b.onclick=function(){go(i);};
    r.appendChild(b);
  });
}
function gateCheck(i){
  if(i===0){var m=M(),miss=[];[['name',m.name],['tag',m.tag],['client',m.client],['location',m.location]].forEach(function(p){if(!(p[1]||'').trim())miss.push(p[0]);});
    if(miss.length) return 'Complete in Machine: '+miss.join(', ')+' — before continuing.';}
  if(i===1 && !built) return 'Build the train in the Constructor (Construir máquina) before continuing.';
  return '';
}
function go(i){step=i;render();if(i===5)act('validate');}

// ---------------- 1 · Machine ----------------
function stepMachine(){
  var m=M(), g=gw(), mb=g.modbus;
  var libOpts=[['','— select —']].concat(LIB.map(function(x){return [x.id,x.label];}));
  var h='<div class="sub">Load an existing machine ('+(HOST==='field'?'library + cloud ☁':'cloud')+')</div>'+
  '<div class="row">'+fld('',sel('mLib',libOpts,CUR),true)+'<button class="btn" id="mLoad">Load</button>'+
   (HOST==='field'?'<button class="btn ghost" id="mFile">📁 Open file…</button>':'')+'<button class="btn ghost" id="mNew">+ New machine</button></div>'+
  '<div class="sub">Asset record</div>'+
  '<div class="row">'+fld('Machine name:',inp('mName',m.name,'text','placeholder="e.g. SGT-300A, TG-1"'),true)+fld('Type:',inp('mType',m.machine_type,'text','placeholder="e.g. Turbogenerator, Motor+Pump"'),true)+'</div>'+
  '<div class="row">'+fld('Tag:',inp('mTag',m.tag,'text','placeholder="asset tag / nameplate"'),true)+fld('Client:',inp('mClient',m.client,'text','placeholder="client"'),true)+fld('Location:',inp('mLoc',m.location,'text','placeholder="plant / location"'),true)+'</div>'+
  '<div class="sub">Operation &amp; geometry</div>'+
  '<div class="row">'+fld('Mode:',sel('mOp',MODES,S.op_mode))+fld('RPM:',inp('mRpm',m.rpm_nominal,'number','min="0" max="60000" step="10"'))+
   fld('Rotation:',sel('mRot',['CCW','CW'],m.rotation))+fld('Bearing type:',sel('mBrg',['plain','tilting_pad','rolling','mixed'],m.bearing_type))+'</div>'+
  '<div class="sub">Monitoring type</div>'+
  '<div class="row">'+fld('This machine is for:',sel('mMon',[['spot','Spot — on opportunity (connect, measure, leave)'],['online','Online — continuous monitoring (fixed equipment, 24/7 alarms)']],S.mode),true)+'</div>'+
  '<div class="sub">Live link &amp; signal source</div>'+
  '<div class="row">'+fld('Live link (instance_id):',inp('mInst',S.instance_id,'text','placeholder="key used by Live, trends and reports"'),true)+
   fld('Signal source:',sel('mSrc',[['ni','Watermelon NI node'],['modbus','Modbus — existing protection rack']],S.source))+'</div>';
  if(S.source==='modbus'){
    h+='<div class="row">'+fld('Gateway:',inp('gIp',mb.server_ip||'','text','style="width:140px"'))+fld('Port:',inp('gPort',mb.port||502,'number'))+
     fld('Unit:',inp('gUnit',mb.unit_id||1,'number'))+fld('Byte order:',sel('gOrd',['ABCD','CDAB','BADC','DCBA'],mb.byte_order||'ABCD'))+
     fld('Read (s):',inp('gRd',g.read_interval_seconds||1,'number','step="0.5"'))+fld('Post (s):',inp('gPost',g.poll_interval_seconds||10,'number'))+'</div>'+
     '<div class="hint">The site collector downloads this map from the published version. When the NI node replaces the rack, switch the source to NI node — sensor names and Live variables stay, so trends continue.</div>';
  }
  $('main').innerHTML=h;
  bindv('mName',function(v){m.name=v;});bindv('mType',function(v){m.machine_type=v;});bindv('mTag',function(v){m.tag=v;});
  bindv('mClient',function(v){m.client=v;});bindv('mLoc',function(v){m.location=v;});
  bindv('mOp',function(v){S.op_mode=v;S.acquisition.averages=(v==='estable'?4:1);});
  bindv('mRpm',function(v){m.rpm_nominal=v;},true);bindv('mRot',function(v){m.rotation=v;});bindv('mBrg',function(v){m.bearing_type=v;});
  bindv('mMon',function(v){S.mode=v;renderActions();});bindv('mInst',function(v){S.instance_id=v.trim();});
  on('mSrc','change',function(e){S.source=e.target.value;changed();refreshTop();stepMachine();});
  bindv('gIp',function(v){mb.server_ip=v.trim();});bindv('gPort',function(v){mb.port=v;},true);bindv('gUnit',function(v){mb.unit_id=v;},true);
  bindv('gOrd',function(v){mb.byte_order=v;});bindv('gRd',function(v){g.read_interval_seconds=v;},true);bindv('gPost',function(v){g.poll_interval_seconds=v;},true);
  on('mLoad','click',function(){var id=$('mLib').value;if(!id){toast('Select a machine to load');return;}act('load',{id:id});});
  on('mNew','click',function(){act('new');});
  on('mFile','click',function(){act('open_file');});
}

// ---------------- 2 · Constructor ----------------
function bHash(view){return (view?'view-':'')+(document.body.classList.contains('light')?'light-':'')+'embed';}
function stepConstructor(){
  var rep='';
  if(REPORT){var a=REPORT.added||[],k=REPORT.matched||[],o=REPORT.not_in_train||[];
    rep='<div class="callout"><b>Built:</b> '+(a.length?'+'+a.length+' new probe(s) '+esc(a.map(disp).join(', '))+' · ':'')+k.length+' existing kept as-is'+
      (o.length?' · '+o.length+' not in the drawn train (kept): '+esc(o.map(disp).join(', ')):'')+'. Continue to <b>Sensors &amp; layout</b>.</div>';}
  $('main').innerHTML=(!(S.layout&&S.layout.machines&&S.layout.machines.length)&&S.channels.length?
     '<div class="callout">This machine has sensors but no train drawing yet — draw it once. Existing sensors keep their Live names, Modbus registers and limits.</div>':'')+
    '<iframe class="frame" id="bFrame" title="Train builder" style="height:760px"></iframe>'+rep;
  bFrame=$('bFrame');bFrame.src='builder.html#'+bHash(false);
  bFrame.onload=function(){ if(S.layout&&S.layout.machines&&S.layout.machines.length) bFrame.contentWindow.postMessage({wm:'load',spec:S.layout},'*'); };
}

// ---------------- 3 · Sensors & layout ----------------
function nextBnc(){return S.channels.reduce(function(m,c){return Math.max(m,c.bnc_port||0);},0)+1;}
function newChannel(label,type){var d=D.types[type]||{};return {bnc_port:nextBnc(),point_label:label,plane:1,sensor_type:type,
  sensitivity_mv_per_eu:d.sens||100,unit_native:d.unit||'',coupling:d.coupling||'AC',angle_deg:0,side:'',alarm:d.alarm||0,danger:d.danger||0,
  full_scale:0,gap_bias_v:d.gap||0,active:true,events_per_rev:1,trigger_v:0,notch_type:'',keyphasor_ref:'',pair_ref:'',variable:'',location:'',direction:'',modbus:{}};}
function stepSensors(){
  var rows=S.channels.map(function(c,i){
    return '<tr data-i="'+i+'"'+(i===selCh?' class="sel"':'')+'><td class="lbl" style="color:'+KCOL[c.sensor_type]+'">'+esc(disp(c.point_label))+'</td>'+
      '<td>'+sel('sT'+i,TYPES.map(function(k){return [k,KNAME[k]];}),c.sensor_type)+'</td>'+
      '<td><input id="sB'+i+'" type="number" value="'+c.bnc_port+'" min="1" max="64"></td>'+
      '<td><input id="sA'+i+'" type="number" value="'+c.angle_deg+'" min="0" max="360" step="5"></td>'+
      '<td>'+sel('sS'+i,['—','R','L'],c.side||'—')+'</td></tr>';}).join('');
  $('main').innerHTML='<div class="legend"><span><span class="dot" style="background:var(--c-prox)"></span>Proximity</span><span><span class="dot" style="background:var(--c-vel)"></span>Velocity</span><span><span class="dot" style="background:var(--c-accel)"></span>Accelerometer</span><span><span class="dot" style="background:var(--c-kph)"></span>Keyphasor</span><span>API 670 angle: from TDC · R = clockwise · L = counter-clockwise (45°L + 45°R = 90°)</span></div>'+
   '<div class="split"><div class="tbl pick"><table><thead><tr><th>Channel</th><th>Type</th><th>BNC</th><th>Angle°</th><th>Side</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<iframe class="frame" id="vFrame" title="Machine layout" style="height:320px"></iframe></div>'+
   '<div class="row"><button class="btn" id="sAdd">+ Sensor</button><button class="btn" id="sDel">– Remove</button><span class="hint">Sensitivity, gap, alarms and advanced fields: Channel editor (double-click a row).</span></div>';
  vFrame=$('vFrame');vFrame.src='builder.html#'+bHash(true);
  vFrame.onload=function(){ if(S.layout&&S.layout.machines) vFrame.contentWindow.postMessage({wm:'load',spec:S.layout},'*'); };
  S.channels.forEach(function(c,i){
    bindv('sT'+i,function(v){c.sensor_type=v;var d=D.types[v]||{};c.unit_native=d.unit||c.unit_native;c.coupling=d.coupling||c.coupling;c.sensitivity_mv_per_eu=d.sens||c.sensitivity_mv_per_eu;});
    bindv('sB'+i,function(v){c.bnc_port=v;},true);bindv('sA'+i,function(v){c.angle_deg=v;},true);
    bindv('sS'+i,function(v){c.side=(v==='—'?'':v);});
  });
  Array.prototype.forEach.call(document.querySelectorAll('#main tbody tr'),function(tr){
    tr.addEventListener('click',function(e){if(e.target.closest('input,select'))return;selCh=+tr.dataset.i;stepSensors();});
    tr.addEventListener('dblclick',function(){selCh=+tr.dataset.i;go(3);});
  });
  on('sAdd','click',function(){var c=newChannel('P'+(S.channels.length+1),'accelerometer');S.channels.push(c);selCh=S.channels.length-1;changed();stepSensors();});
  on('sDel','click',function(){if(!S.channels.length)return;var c=S.channels[selCh];
    if(c.modbus&&Object.keys(c.modbus).length&&pendingDel!==c){pendingDel=c;toast(disp(c.point_label)+' feeds Live via Modbus — press Remove again to confirm');return;}
    pendingDel=null;S.channels.splice(selCh,1);selCh=Math.max(0,selCh-1);changed();stepSensors();});
}

// ---------------- 4 · Channel editor ----------------
function dial(ang,side,type){
  var a=(side==='L'?-ang:ang)*Math.PI/180,cx=80,cy=80,r=56,px=cx+r*Math.sin(a),py=cy-r*Math.cos(a),col=KCOL[type]||'var(--accent)';
  return '<svg width="160" height="176" viewBox="0 0 160 176" role="img" aria-label="Probe orientation">'+
   '<circle cx="80" cy="80" r="66" fill="var(--panel2)" stroke="var(--line)" stroke-width="1.5"/>'+
   '<circle cx="80" cy="80" r="22" fill="var(--input)" stroke="var(--dim)" stroke-width="1.5"/>'+
   '<line x1="80" y1="8" x2="80" y2="20" stroke="var(--mute)" stroke-width="2"/>'+
   '<text x="80" y="34" text-anchor="middle" font-size="9" font-family="monospace" fill="var(--mute)">TDC</text>'+
   '<text x="146" y="84" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--mute)">R</text>'+
   '<text x="14" y="84" text-anchor="middle" font-size="10" font-family="monospace" fill="var(--mute)">L</text>'+
   '<line x1="80" y1="80" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="'+col+'" stroke-width="2.5"/>'+
   '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="7" fill="'+col+'" stroke="var(--bg)" stroke-width="1.5"/>'+
   '<text x="80" y="168" text-anchor="middle" font-size="12" font-weight="600" font-family="monospace" fill="var(--ink)">'+ang+'°'+(side||'')+'</text></svg>';
}
function stepChannel(){
  if(!S.channels.length){$('main').innerHTML='<div class="callout">No channels yet — build the train in the Constructor.</div>';return;}
  var c=S.channels[selCh], kphs=S.channels.filter(function(x){return x.sensor_type==='keyphasor';}).map(function(x){return [x.point_label,disp(x.point_label)];});
  var pairs=S.channels.filter(function(x){return x!==c&&x.sensor_type==='proximity';}).map(function(x){return [x.point_label,disp(x.point_label)];});
  var units=(D.units[c.sensor_type]||[]).slice(); if(c.unit_native&&units.indexOf(c.unit_native)<0) units.unshift(c.unit_native);
  var mb=Object.keys(c.modbus||{});
  $('main').innerHTML='<div class="row"><div class="fld"><label>Channel:</label>'+sel('cSel',S.channels.map(function(x,i){return [i,disp(x.point_label)];}),selCh)+'</div>'+
    '<button class="btn ghost" id="cPrev" aria-label="Previous channel">‹</button><button class="btn ghost" id="cNext" aria-label="Next channel">›</button>'+
    '<span class="hint">Bearing '+c.plane+(c.location?' · '+esc(c.location):'')+'</span></div>'+
   '<div class="grp"><div class="sub">Identification (API 670)</div><div class="row">'+fld('Point:',inp('cPt',disp(c.point_label),'text','style="width:110px"'))+fld('BNC:',inp('cBnc',c.bnc_port,'number','min="1" max="64"'))+
     fld('Bearing:',inp('cBrg',c.plane,'number','min="0" max="24"'))+'<label class="fld"><input id="cAct" type="checkbox" '+(c.active?'checked':'')+'> Active (collects data)</label></div></div>'+
   '<div class="grp"><div class="sub">Transducer</div><div class="row">'+fld('Type:',sel('cType',TYPES.map(function(k){return [k,KNAME[k]];}),c.sensor_type))+
     fld('Sensitivity mV/EU:',inp('cSens',c.sensitivity_mv_per_eu,'number','step="10"'))+fld('Unit:',sel('cUnit',units,c.unit_native))+fld('Coupling:',sel('cCoup',['DC','AC','IEPE'],c.coupling))+'</div>'+
     '<div class="row">'+fld('Full-scale (EU):',inp('cFull',c.full_scale,'number'))+fld('Gap/Bias (V):',inp('cGap',c.gap_bias_v,'number','step="0.1"'))+'</div></div>'+
   '<div class="grp"><div class="sub">Orientation (TDC top · R clockwise · L counter-clockwise)</div><div class="dialwrap"><div class="grp">'+
     fld('Angle°:',inp('cAng',c.angle_deg,'number','min="0" max="360" step="5"'))+fld('Side:',sel('cSide',['—','R','L'],c.side||'—'))+'</div><div id="cDial">'+dial(c.angle_deg,c.side,c.sensor_type)+'</div></div></div>'+
   '<div class="grp"><div class="sub">Associations (phase reference + orbit pair)</div><div class="row">'+
     fld('Associated keyphasor:',sel('cKph',[['','—']].concat(kphs),c.keyphasor_ref||''))+fld('X/Y pair (orbit):',sel('cPair',[['','—']].concat(pairs),c.pair_ref||''))+'</div></div>'+
   '<div class="grp"><div class="sub">Alarms (API 670 / ISO 20816)</div><div class="row">'+fld('Alert:',inp('cAl',c.alarm,'number','step="0.1"'))+fld('Danger:',inp('cDa',c.danger,'number','step="0.1"'))+
     '<span class="hint" id="cUnitH">'+esc(c.unit_native)+'</span></div></div>'+
   '<div class="grp"><div class="sub">Live &amp; signal source</div><div class="row">'+
     fld('Live variable:',inp('cVar',c.variable,'text','placeholder="'+esc(disp(c.point_label))+'"'),true)+fld('Location:',inp('cLoc',c.location,'text'),true)+'</div>'+
     (mb.length?'<div class="mb">Modbus registers (rack): '+mb.sort(function(a,b){return c.modbus[a].register-c.modbus[b].register;}).map(function(k){return esc(k.split('@')[0])+' → '+c.modbus[k].register;}).join(' · ')+'</div>':
       '<div class="mb">No Modbus registers — read by the NI node (BNC '+c.bnc_port+').</div>')+
     '<div class="hint">Keep the Live variable when migrating Modbus → NI: trends continue on the same line.</div></div>'+
   '<div class="row" style="justify-content:flex-end"><span id="cOk" style="color:var(--ok);font-weight:700"></span><button class="btn go" id="cApply">✓ Apply to channel</button></div>';
  on('cSel','change',function(e){selCh=+e.target.value;stepChannel();});
  on('cPrev','click',function(){selCh=(selCh-1+S.channels.length)%S.channels.length;stepChannel();});
  on('cNext','click',function(){selCh=(selCh+1)%S.channels.length;stepChannel();});
  function redial(){$('cDial').innerHTML=dial(num($('cAng').value),$('cSide').value==='—'?'':$('cSide').value,$('cType').value);}
  on('cAng','input',redial);on('cSide','change',redial);
  on('cType','change',function(){var t=$('cType').value,d=D.types[t]||{};$('cUnit').innerHTML=(D.units[t]||[]).map(function(u){return '<option>'+esc(u)+'</option>';}).join('');
    $('cSens').value=d.sens||0;$('cCoup').value=d.coupling||'AC';redial();});
  on('cApply','click',function(){
    c.point_label=canon($('cPt').value)||c.point_label;c.bnc_port=num($('cBnc').value);c.plane=num($('cBrg').value);c.active=$('cAct').checked;
    c.sensor_type=$('cType').value;c.sensitivity_mv_per_eu=num($('cSens').value);c.unit_native=$('cUnit').value;c.coupling=$('cCoup').value;
    c.full_scale=num($('cFull').value);c.gap_bias_v=num($('cGap').value);c.angle_deg=num($('cAng').value);c.side=$('cSide').value==='—'?'':$('cSide').value;
    c.keyphasor_ref=$('cKph').value;c.pair_ref=$('cPair').value;c.alarm=num($('cAl').value);c.danger=num($('cDa').value);
    c.variable=$('cVar').value.trim();c.location=$('cLoc').value.trim();
    $('cOk').textContent='✓ Applied to '+disp(c.point_label);changed();
  });
}

// ---------------- 5 · Acquisition ----------------
function stepAcq(){
  var a=S.acquisition, fs=S.sampling_hz||autoFs(), ords=a.orders||[];
  function hasO(o){return ords.some(function(x){return Math.abs(x-o)<1e-6;});}
  var bandRows=[['proximity','Proximity'],['velometer','Velocity'],['accelerometer','Accelerometer']].map(function(p){var b=bandOf(p[0]);
    return '<div class="row"><span style="min-width:130px"><span class="dot" style="background:'+KCOL[p[0]]+'"></span>'+p[1]+'</span>'+
     fld('Fmin (Hz):',inp('bn_'+p[0],b.fmin_hz,'number'))+fld('Fmax (Hz):',inp('bx_'+p[0],b.fmax_hz,'number','step="100"'))+fld('Lines:',sel('bl_'+p[0],[400,800,1600,3200,6400],b.lines))+
     '<span class="mb">Δf '+((b.fmax_hz||0)/(b.lines||1)).toFixed(2)+' Hz</span></div>';}).join('');
  var mbRows=[['prox','Proximity (displacement)','proximity'],['vel','Velocity','velometer'],['accel','Accelerometer (velocity)','accelerometer']].map(function(p){var m=(S.measure_band||{})[p[0]]||[0,0];
    return '<div class="row"><span style="min-width:200px"><span class="dot" style="background:'+KCOL[p[2]]+'"></span>'+p[1]+'</span>'+fld('Fmin (Hz):',inp('mn_'+p[0],m[0],'number'))+fld('Fmax (Hz):',inp('mx_'+p[0],m[1],'number','step="50"'))+'</div>';}).join('');
  $('main').innerHTML='<div class="sub">Train-wide</div><div class="row">'+
    fld('Sampling (Hz):',inp('aFs',fs,'number','step="1280" min="256" max="102400"'))+fld('Frequency:',sel('aFq',[['cpm','CPM'],['hz','Hz']],a.freq_unit))+
    fld('Waveform:',sel('aWf',['synchronous','asynchronous'],a.waveform_mode))+fld('Samples/rev:',inp('aSpr',a.samples_per_rev,'number'))+
    fld('Averages:',inp('aAvg',a.averages,'number','min="1" max="64"'))+fld('Window:',sel('aWin',['hanning','flattop','uniform'],a.window))+'</div>'+
    '<div class="row"><span class="fld"><label>Orders (×rpm):</label></span>'+[[0.5,'½X'],[1,'1X'],[2,'2X'],[3,'3X']].map(function(o,i){
      return '<label class="fld"><input type="checkbox" id="o'+i+'" data-o="'+o[0]+'" '+(hasO(o[0])?'checked':'')+'> '+o[1]+'</label>';}).join('')+'</div>'+
    '<div class="hint">Sampling follows RPM (Fmax = fs / 2.56 covers ~12X); you can override it. NI-9229 limit 50 000 S/s.</div>'+
    '<div class="sub">Acquisition band per sensor type (ISO 20816 / API 670)</div>'+bandRows+
    '<div class="sub">Measurement band — Direct/overall (API 670 / ISO 20816)</div>'+mbRows+
    '<div class="hint">Proximity 1–1000 Hz (API 670 / ISO 7919) · velocity/accelerometer 10–1000 Hz (ISO 20816). Only affects Direct.'+
    (S.source==='modbus'?' With the Modbus source the rack computes Direct; these bands apply when the NI node takes over — match them to the rack before the cut-over.':'')+'</div>';
  bindv('aFs',function(v){S.sampling_hz=v;},true);bindv('aFq',function(v){a.freq_unit=v;});bindv('aWf',function(v){a.waveform_mode=v;});
  bindv('aSpr',function(v){a.samples_per_rev=v;},true);bindv('aAvg',function(v){a.averages=v;},true);bindv('aWin',function(v){a.window=v;});
  [0,1,2,3].forEach(function(i){on('o'+i,'change',function(){a.orders=[0,1,2,3].filter(function(j){return $('o'+j).checked;}).map(function(j){return num($('o'+j).dataset.o);});changed();});});
  ['proximity','velometer','accelerometer'].forEach(function(t){
    S.acquisition_by_type=S.acquisition_by_type||{};var b=S.acquisition_by_type[t]=S.acquisition_by_type[t]||{};
    bindv('bn_'+t,function(v){b.fmin_hz=v;},true);bindv('bx_'+t,function(v){b.fmax_hz=v;stepAcq();},true);bindv('bl_'+t,function(v){b.lines=v;stepAcq();},true);});
  ['prox','vel','accel'].forEach(function(k){S.measure_band=S.measure_band||{};var mbk=S.measure_band[k]=S.measure_band[k]||[0,0];
    bindv('mn_'+k,function(v){mbk[0]=v;},true);bindv('mx_'+k,function(v){mbk[1]=v;},true);});
}

// ---------------- 6 · Validation (Python validate_setup) ----------------
function stepValidation(){
  var top='<div class="row"><b>Validation</b><span class="hint">API 670 / ISO 20816 · runs on the current configuration</span><span style="flex:1"></span><button class="btn next" id="vRun">↻ Validate now</button></div>';
  if(FIND===null){$('main').innerHTML=top+'<div class="hint">Validating…</div>';on('vRun','click',function(){act('validate');});return;}
  var ne=FIND.filter(function(x){return x.level==='error';}).length, nw=FIND.filter(function(x){return x.level==='warn';}).length;
  var cls=ne?'error':(nw?'warn':'ok'), txt=ne?ne+' error(s) · '+nw+' warning(s) — fix errors before '+(HOST==='field'?'measuring':'publishing'):(nw?nw+' warning(s) — review recommended':'Configuration valid — no findings');
  $('main').innerHTML=top+'<div class="vsum '+cls+'">'+txt+'</div><div class="findings">'+FIND.map(function(x){return '<div class="fi '+esc(x.level)+'"><span class="s"></span><span>'+esc(x.message)+'</span><code>'+esc(x.code)+'</code></div>';}).join('')+'</div>'+
    '<div class="hint">'+(HOST==='field'?'Start (measure) is enabled only with 0 errors.':'Publish is enabled only with 0 errors.')+'</div>';
  on('vRun','click',function(){FIND=null;stepValidation();act('validate');});
}

}

// ---------------- action bar (only the destination differs per host) ----------------
function renderActions(){
  if(!S){$('actions').innerHTML='';return;}
  var last=step>=6, nv=(V.length?V[0].v:0)+1, errs=(FIND||[]).filter(function(x){return x.level==='error';}).length;
  var h='<button class="btn go" id="aApply">✓ Apply changes</button>'+(last?'':'<button class="btn next" id="aNext">Continuar →</button>')+'<span class="sp"></span>';
  if(HOST==='field') h+='<button class="btn go" id="aCloud">Save machine to Watermelon System</button><button class="btn" id="aFile">💾 Save to file…</button><button class="btn red" id="aSave">Save configuration</button><button class="btn red" id="aMeasure">Apply &amp; measure</button>';
  else h+='<button class="btn" id="aDraft">Save draft</button><button class="btn next" id="aPub"'+(errs?' disabled title="Fix Validation errors first"':'')+'>Publish v'+nv+'</button>';
  $('actions').innerHTML=h;
  on('aApply','click',function(){act('apply');toast('Changes applied');});
  on('aNext','click',function(){var w=gateCheck(step);if(w){toast(w);return;}unlocked=Math.max(unlocked,step+1);go(step+1);});
  on('aCloud','click',function(){act('save_cloud');});on('aFile','click',function(){act('save_file');});
  on('aSave','click',function(){act('save_local');});on('aMeasure','click',function(){act('apply_measure');});
  on('aDraft','click',function(){act('save_draft');});on('aPub','click',function(){act('publish');});
}
function refreshTop(){
  if(!S)return;var m=M();
  $('tbMach').textContent='·  '+(m.name||'new machine');
  var online=S.mode==='online';
  $('tbMode').textContent=online?'Online':'Spot';$('tbMode').className='badge '+(online?'online':'spot');
  $('tbSrc').textContent=S.source==='modbus'?'Modbus rack':'NI node';
  var pv=pubV();$('tbVer').hidden=!pv;$('tbVer').textContent=pv?('v'+pv+(V.some(function(v){return v.st==='draft';})?' · draft pending':'')):'';
}
function render(){
  if(!S)return;bFrame=null;vFrame=null;renderRail();refreshTop();
  [stepMachine,stepConstructor,stepSensors,stepChannel,stepAcq,stepValidation,stepSummary][step]();
  renderActions();
}
send({wm:'ready'});
})();
</script>
