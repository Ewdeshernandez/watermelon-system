<?xml version="1.0" encoding="UTF-8"?>
<!--
  Watermelon Logo · vectorial para usar en el installer
  ======================================================
  Para generar:
    - watermelon.ico (icono del .exe + installer):
        Subir este SVG a https://convertio.co/svg-ico/
        Tamaño recomendado: 256x256 multi-resolución
    - splash.png (imagen del installer):
        Subir a https://convertio.co/svg-png/
        Tamaño recomendado: 600x400
-->
<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular verde-azul gradient (clase mundial) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="meatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="128" cy="128" r="124" fill="url(#bgGrad)"/>

  <!-- Sandía estilizada (sector del cuarto) -->
  <g transform="translate(128 128)">
    <!-- Cáscara verde (semi-circle bottom) -->
    <path d="M -88 0 A 88 88 0 0 0 88 0 L 76 0 A 76 76 0 0 1 -76 0 Z"
          fill="#16a34a"/>
    <!-- Cáscara verde claro (banda interior) -->
    <path d="M -76 0 A 76 76 0 0 0 76 0 L 70 0 A 70 70 0 0 1 -70 0 Z"
          fill="#86efac"/>
    <!-- Carne rosada -->
    <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="url(#meatGrad)"/>
    <!-- Semillas negras -->
    <ellipse cx="-40" cy="22" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(-15 -40 22)"/>
    <ellipse cx="-15" cy="35" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(5 -15 35)"/>
    <ellipse cx="15" cy="35" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(-5 15 35)"/>
    <ellipse cx="40" cy="22" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(15 40 22)"/>
    <ellipse cx="-25" cy="50" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(-10 -25 50)"/>
    <ellipse cx="0" cy="55" rx="3.5" ry="6" fill="#1f2937"/>
    <ellipse cx="25" cy="50" rx="3.5" ry="6" fill="#1f2937"
             transform="rotate(10 25 50)"/>
  </g>

  <!-- Texto WATERMELON arriba -->
  <text x="128" y="60" font-family="Arial,sans-serif" font-size="22"
        font-weight="800" text-anchor="middle" fill="white"
        letter-spacing="2">WATERMELON</text>
  <text x="128" y="84" font-family="Arial,sans-serif" font-size="14"
        font-weight="500" text-anchor="middle" fill="#a7f3d0"
        letter-spacing="3">PLANTA EDITION</text>

  <!-- Pequeño tagline abajo -->
  <text x="128" y="240" font-family="Arial,sans-serif" font-size="10"
        text-anchor="middle" fill="rgba(255,255,255,0.6)"
        letter-spacing="2">SIGA GROUP · MODAL ANALYSIS</text>
</svg>
