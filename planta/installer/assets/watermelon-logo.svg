<?xml version="1.0" encoding="UTF-8"?>
<!--
  Watermelon Planta Edition · Logo Vectorial v2 (Clase Mundial)
  ===============================================================
  Diseño profesional listo para ICO, PNG, PDF, print.

  Especificaciones:
    Viewbox: 256x256 (square, perfecto para favicon/ICO)
    Paleta: gradient navy → teal (corporate Watermelon-SIGA)
    Carne sandía: rosado-rojo gradient con shadow interna
    Tipografía: Inter / system-ui (universal, legible en cualquier OS)
    Aria-label: accesibilidad

  Para exportar:
    .ico (multi-res):  https://convertio.co/svg-ico → 256/128/64/48/32/16
    .png 1024x1024:   https://convertio.co/svg-png → para landing page
    .png 600x400:     splash installer Inno Setup
-->
<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Watermelon Planta Edition logo">

  <defs>
    <!-- Gradient fondo principal (navy → teal corporate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="50%"  stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Glow exterior sutil -->
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Cáscara verde de la sandía -->
    <linearGradient id="rindGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#14532d"/>
      <stop offset="50%"  stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Carne rosada (gradient + shadow interna) -->
    <linearGradient id="meatGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#9f1239"/>
      <stop offset="40%"  stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <!-- Inner shadow para dar profundidad -->
    <filter id="meatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow del círculo completo -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- Fondo: círculo con gradient + glow                            -->
  <!-- ============================================================ -->
  <g filter="url(#dropShadow)">
    <circle cx="128" cy="128" r="124" fill="url(#bgGrad)"/>
    <circle cx="128" cy="128" r="124" fill="url(#glowGrad)"/>
  </g>

  <!-- Anillo sutil exterior para definición -->
  <circle cx="128" cy="128" r="124" fill="none"
          stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- Texto WATERMELON arriba                                       -->
  <!-- ============================================================ -->
  <text x="128" y="58"
        font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="20" font-weight="800"
        text-anchor="middle" fill="#ffffff"
        letter-spacing="4">WATERMELON</text>

  <text x="128" y="80"
        font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="11" font-weight="500"
        text-anchor="middle" fill="#a7f3d0"
        letter-spacing="5">PLANTA EDITION</text>

  <!-- Línea divisoria sutil debajo del título -->
  <line x1="80" y1="92" x2="176" y2="92"
        stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>

  <!-- ============================================================ -->
  <!-- Sandía central — sector inferior (semicírculo)                -->
  <!-- ============================================================ -->
  <g transform="translate(128 152)">
    <!-- Cáscara verde exterior con gradient -->
    <path d="M -82 0 A 82 82 0 0 0 82 0 L 76 0 A 76 76 0 0 1 -76 0 Z"
          fill="url(#rindGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

    <!-- Cáscara verde claro (banda interior) -->
    <path d="M -76 0 A 76 76 0 0 0 76 0 L 71 0 A 71 71 0 0 1 -71 0 Z"
          fill="#bbf7d0" opacity="0.9"/>

    <!-- Carne rosada con gradient -->
    <path d="M -71 0 A 71 71 0 0 0 71 0 Z"
          fill="url(#meatGrad)" filter="url(#meatShadow)"/>

    <!-- Brillo de carne (highlight sutil) -->
    <path d="M -50 30 Q -10 50 50 30 L 50 35 Q -10 55 -50 35 Z"
          fill="rgba(255,255,255,0.15)"/>

    <!-- ============================================================ -->
    <!-- Semillas distribución natural (escalonadas, no en grid)       -->
    <!-- ============================================================ -->
    <g fill="#1f2937" opacity="0.92">
      <ellipse cx="-45" cy="20" rx="3"   ry="5.5"
               transform="rotate(-18 -45 20)"/>
      <ellipse cx="-22" cy="32" rx="3"   ry="5.5"
               transform="rotate(8 -22 32)"/>
      <ellipse cx="2"   cy="38" rx="3"   ry="5.5"
               transform="rotate(-3 2 38)"/>
      <ellipse cx="26"  cy="32" rx="3"   ry="5.5"
               transform="rotate(-8 26 32)"/>
      <ellipse cx="45"  cy="20" rx="3"   ry="5.5"
               transform="rotate(18 45 20)"/>
      <ellipse cx="-30" cy="50" rx="2.8" ry="5"
               transform="rotate(-12 -30 50)"/>
      <ellipse cx="-5"  cy="55" rx="2.8" ry="5"/>
      <ellipse cx="20"  cy="52" rx="2.8" ry="5"
               transform="rotate(10 20 52)"/>
      <ellipse cx="38"  cy="44" rx="2.8" ry="5"
               transform="rotate(20 38 44)"/>
      <ellipse cx="-38" cy="38" rx="2.5" ry="4.5"
               transform="rotate(-15 -38 38)"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Footer: tagline corporativo abajo                             -->
  <!-- ============================================================ -->
  <text x="128" y="244"
        font-family="-apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="9" font-weight="500"
        text-anchor="middle" fill="rgba(255,255,255,0.7)"
        letter-spacing="3">SIGA GROUP · MODAL ANALYSIS</text>

</svg>
